{extend name="layout" /}

{block name="content"}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 mt-12">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">注册</h2>
    
    <form id="registerForm" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
            <input type="text" name="username" required minlength="3"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
            <input type="password" name="password" required minlength="6"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
            <input type="password" name="password_confirm" required minlength="6"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <div id="passwordMismatch" class="hidden text-red-500 text-sm mt-1"></div>
        </div>
        
        <div id="registerError" class="hidden text-red-500 text-sm"></div>
        <div id="registerSuccess" class="hidden text-green-500 text-sm"></div>
        
        <button type="submit" 
                class="w-full py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">
            注册
        </button>
    </form>
    
    <div class="mt-4 text-center text-sm text-gray-600">
        已有账号？<a href="/login" class="text-green-600 hover:text-green-700">立即登录</a>
    </div>
</div>

<script>
$(document).ready(function() {
    // 实时验证密码是否一致
    $('input[name="password_confirm"]').on('input', function() {
        const password = $('input[name="password"]').val();
        const passwordConfirm = $(this).val();
        
        if (passwordConfirm.length > 0 && password !== passwordConfirm) {
            $('#passwordMismatch').text('两次密码输入不一致').removeClass('hidden');
            $(this).addClass('border-red-500');
        } else {
            $('#passwordMismatch').addClass('hidden');
            $(this).removeClass('border-red-500');
        }
    });
    
    $('input[name="password"]').on('input', function() {
        const password = $(this).val();
        const passwordConfirm = $('input[name="password_confirm"]').val();
        
        if (passwordConfirm.length > 0 && password !== passwordConfirm) {
            $('#passwordMismatch').text('两次密码输入不一致').removeClass('hidden');
            $('input[name="password_confirm"]').addClass('border-red-500');
        } else {
            $('#passwordMismatch').addClass('hidden');
            $('input[name="password_confirm"]').removeClass('border-red-500');
        }
    });
    
    $('#registerForm').on('submit', function(e) {
        e.preventDefault();
        
        const password = $('input[name="password"]').val();
        const passwordConfirm = $('input[name="password_confirm"]').val();
        
        if (password !== passwordConfirm) {
            $('#registerError').text('两次密码输入不一致').removeClass('hidden');
            $('#passwordMismatch').text('两次密码输入不一致').removeClass('hidden');
            return;
        }
        
        // 清除之前的错误提示
        $('#passwordMismatch').addClass('hidden');
        
        const formData = {
            username: $('input[name="username"]').val(),
            password: password
        };
        
        $.ajax({
            url: '/api/register',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function(res) {
                if (res.code === 200) {
                    $('#registerError').addClass('hidden');
                    $('#registerSuccess').text('注册成功！正在跳转...').removeClass('hidden');
                    setTimeout(function() {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    $('#registerError').text(res.msg || '注册失败').removeClass('hidden');
                }
            },
            error: function(xhr) {
                const res = xhr.responseJSON || {};
                $('#registerError').text(res.msg || '网络错误，请重试').removeClass('hidden');
            }
        });
    });
});
</script>
{/block}
