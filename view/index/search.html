{extend name="layout" /}

{block name="content"}
<div class="max-w-7xl mx-auto space-y-6 animate-fade-in px-4">
    <!-- 顶部搜索框 -->
    <div class="max-w-3xl mx-auto pt-6 relative">
        <div class="relative group">
            <div class="absolute inset-y-0 left-4 md:left-5 flex items-center pointer-events-none text-gray-400">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input
                type="text"
                id="pageSearchInput"
                class="w-full h-12 md:h-14 pl-12 md:pl-14 pr-12 md:pr-14 text-sm md:text-base bg-white border-2 border-[#10b981] rounded-3xl focus:outline-none focus:border-[#10b981] transition-all placeholder:text-gray-400"
                placeholder="搜索电影、电视剧..." autocomplete="off"
            >
            <button id="clearSearchBtn" title="清空搜索" class="absolute right-4 md:right-5 inset-y-0 hidden items-center text-gray-300 hover:text-gray-500">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
            </button>
            
            <!-- 搜索建议下拉框 -->
            <div id="searchSuggestions" class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border-2 border-gray-100 max-h-[400px] overflow-y-auto z-[100]">
                <div id="suggestionsList" class="py-2"></div>
            </div>
        </div>
    </div>

    <!-- 欢迎界面/历史 -->
    <div id="welcomeState" class="space-y-8 max-w-7xl mx-auto mt-8">
        <div id="searchHistory" class="hidden">
            <div class="flex items-center gap-4 mb-5">
                <h3 class="text-lg font-bold text-gray-900">搜索历史</h3>
                <button onclick="clearSearchHistory()" class="text-sm text-gray-400 hover:text-gray-600 transition-colors">清空</button>
            </div>
            <div id="historyTags" class="flex flex-wrap gap-3"></div>
        </div>
    </div>

    <!-- 搜索结果区 -->
    <div id="searchResults" class="hidden space-y-6">
        <!-- 搜索结果标题和进度 -->
        <div class="flex items-center gap-3 mb-4">
            <h2 class="text-xl font-bold text-gray-900">搜索结果</h2>
            <div class="flex items-center gap-2">
                <span id="searchProgress" class="text-sm text-gray-400"></span>
                <div id="searchSpinner" class="hidden">
                    <svg class="animate-spin h-4 w-4 text-[#10b981]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            </div>
        </div>
        
        <!-- 筛选条 -->
        <div class="flex flex-wrap items-center gap-4 md:gap-8 text-sm text-gray-500 pb-4 border-b border-gray-100 overflow-x-auto no-scrollbar whitespace-nowrap relative z-40">
            <div class="relative">
                <button class="flex items-center gap-1.5 transition-colors" id="filter-source-btn">
                    <span id="label-source" class="transition-colors">来源</span>
                    <svg id="source-arrow" class="w-3.5 h-3.5 transition-transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div class="fixed bg-white rounded-xl shadow-2xl border p-4 hidden z-[9999] grid grid-cols-3 md:grid-cols-5 gap-2 w-[85vw] md:w-[480px] max-w-[480px] max-h-[400px] overflow-y-auto no-scrollbar" id="sourceOptions"></div>
            </div>
            <div class="relative">
                <button class="flex items-center gap-1.5 transition-colors" id="filter-title-btn">
                    <span id="label-title" class="transition-colors">标题</span>
                    <svg id="title-arrow" class="w-3.5 h-3.5 transition-transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div class="fixed bg-white rounded-xl shadow-2xl border p-4 hidden z-[9999] grid grid-cols-3 md:grid-cols-5 gap-2 w-[85vw] md:w-[480px] max-w-[480px] max-h-[400px] overflow-y-auto no-scrollbar" id="titleOptions"></div>
            </div>
            <div class="relative">
                <button class="flex items-center gap-1.5 transition-colors" id="filter-year-btn">
                    <span id="label-year" class="transition-colors">年份</span>
                    <svg id="year-arrow" class="w-3.5 h-3.5 transition-transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div class="fixed bg-white rounded-xl shadow-2xl border p-4 hidden z-[9999] grid grid-cols-3 md:grid-cols-5 gap-2 w-[85vw] md:w-[450px] max-w-[450px] max-h-[400px] overflow-y-auto no-scrollbar" id="yearOptions"></div>
            </div>
            <button id="toggleSortBtn" class="flex items-center gap-1.5 hover:text-gray-800 transition-colors">
                <span>年份</span>
                <svg id="sortIcon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>
            </button>
            <button id="resetFiltersBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-gradient-to-r from-gray-50 to-gray-100 hover:from-[#10b981]/10 hover:to-[#10b981]/5 text-gray-500 hover:text-[#10b981] border border-gray-200 hover:border-[#10b981]/30 transition-all duration-300 shadow-sm hover:shadow group">
                <svg class="w-3.5 h-3.5 transition-transform group-hover:rotate-180 duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span class="text-xs font-medium">重置</span>
            </button>
            <div class="flex-1 text-right text-gray-400 font-mono text-xs" id="resultsCount">0/0</div>
        </div>

        <div id="resultsGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 2xl:grid-cols-8 gap-3 sm:gap-5"></div>
        <!-- 加载动画 - 极简效果 -->
        <div id="loadingMore" class="hidden text-center py-20">
            <div class="mx-auto loader-curve w-12 h-12 border-[3px] border-transparent border-t-[#10b981] rounded-full animate-spin"></div>
            <p class="mt-4 text-xs tracking-widest text-gray-400 uppercase">Searching</p>
        </div>
    </div>
    <div id="emptyState" class="hidden text-center py-20 text-gray-300">暂无资源内容</div>
</div>

<style>
    .filter-option {
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        text-align: left;
        font-size: 12px;
        color: #6b7280;
        border: 1px solid transparent;
        word-wrap: break-word;
        overflow-wrap: break-word;
        white-space: normal;
        line-height: 1.4;
    }
    .filter-option:hover { background-color: #f9fafb; color: #10b981; }
    .filter-option.active { background-color: #f0fdf4; color: #10b981; font-weight: bold; border-color: rgba(16,185,129,0.1); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    /* 历史标签悬停效果 */
    .history-tag .close-btn {
        display: none;
    }
    .history-tag:hover .close-btn {
        display: flex !important;
    }
    
    /* 搜索建议样式 */
    #searchSuggestions {
        animation: slideDown 0.2s ease-out;
    }
    
    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .suggestion-item {
        padding: 0.75rem 1.25rem;
        cursor: pointer;
        transition: all 0.15s ease;
        border-left: 3px solid transparent;
        font-size: 14px;
        color: #374151;
    }
    
    .suggestion-item:hover {
        background-color: #f9fafb;
        border-left-color: #10b981;
        color: #10b981;
    }
    
    .suggestion-item:active {
        background-color: #f3f4f6;
    }
    
    /* 滚动条美化 */
    #searchSuggestions::-webkit-scrollbar {
        width: 6px;
    }
    
    #searchSuggestions::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
    }
    
    #searchSuggestions::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 10px;
    }
    
    #searchSuggestions::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
    }
</style>

<script>
$(document).ready(function() {
    let rawResults = [], currentSource = 'all', currentYear = 'all', currentTitleMask = 'all', isAsc = false;
    let allSources = []; // 存储所有播放源
    let suggestionTimeout = null; // 防抖定时器
    let currentSuggestions = []; // 当前建议列表
    const input = $('#pageSearchInput'), resultsGrid = $('#resultsGrid');

    // 预定义所有播放源（从 config.json）
    const predefinedSources = [
        '1080资源', '360资源', '暴风资源', '电影天堂',
        '豆瓣资源', '光速资源', '红牛资源', '极速资源',
        '飘零资源', '如意资源', '速博资源', '天涯资源',
        '无尽资源', '新浪资源', 'iKun资源', 'U酷资源',
        '新浪资源', '优质资源', '最大资源', 'CK资源',
        '豪华资源', '量子资源', '猫眼资源', '茅台资源',
        '魔爪资源', '魔都资源', '非凡影视', '百度资源',
        '樱花资源', '卧龙资源', '旺旺短剧', '爱奇艺',
        '金鹰点播', '光速资源'
    ];

    // 初始化播放源筛选器（从搜索结果中提取实际使用的播放源）
    function initSourceFilter() {
        if (rawResults.length === 0) {
            // 如果没有搜索结果,显示空状态
            $('#sourceOptions').html('<div class="text-gray-400 text-xs p-2">暂无数据</div>');
            return;
        }
        
        // 【修复】从原始搜索结果（rawResults）中提取所有播放源，不受分组显示影响
        const usedSources = [...new Set(rawResults.map(item => item.source_name || item.source))].filter(Boolean);
        
        // 调试：输出所有播放源名称和数量
        console.log('初始化播放源筛选器，可用播放源:', usedSources);
        console.log('搜索结果总数:', rawResults.length, '播放源数量:', usedSources.length);
        
        // 生成筛选按钮
        let h = '<button class="filter-option active" data-type="source" data-value="all">全部来源</button>';
        usedSources.forEach(sourceName => {
            h += `<button class="filter-option" data-type="source" data-value="${sourceName}">${sourceName}</button>`;
        });
        $('#sourceOptions').html(h);
        
        // 重新绑定播放源筛选按钮的点击事件
        bindSourceFilterEvents();
    }
    
    // 绑定播放源筛选事件
    function bindSourceFilterEvents() {
        $('#sourceOptions .filter-option').off('click').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const val = $(this).data('value');
            console.log('播放源筛选选项点击:', val);
            
            // 更新激活状态
            $('#sourceOptions .filter-option').removeClass('active');
            $(this).addClass('active');
            
            // 更新筛选条件
            currentSource = val;
            const isFiltered = val !== 'all';
            
            // 更新按钮文本和样式
            $('#label-source').text(val === 'all' ? '来源' : val);
            
            // 更新播放源按钮样式
            if (isFiltered) {
                $('#filter-source-btn').addClass('text-[#10b981] font-semibold');
                $('#label-source').addClass('text-[#10b981]');
                $('#source-arrow').removeClass('rotate-180');
            } else {
                $('#filter-source-btn').removeClass('text-[#10b981] font-semibold');
                $('#label-source').removeClass('text-[#10b981]');
                $('#source-arrow').addClass('rotate-180');
            }
            
            // 隐藏下拉框
            $('#sourceOptions').addClass('hidden');
            
            console.log('设置播放源筛选:', currentSource);
            
            // 检查是否需要重新搜索（当前没有结果或搜索词已改变）
            const currentQuery = input.val().trim();
            if (currentQuery && currentQuery !== currentSearchQuery) {
                // 搜索词已改变，需要重新搜索
                triggerSearch(currentQuery);
            } else {
                // 在当前结果基础上应用筛选
                applyCombinedFilters();
            }
        });
    }

    // 获取所有可用播放源(用于后续功能)
    $.get('/api/config/sources').done(res => {
        if (res && res.length) {
            allSources = res.map(s => s.name);
        }
    });

    // 存储当前搜索关键词
    let currentSearchQuery = '';
    
    // 定义 triggerSearch 函数
    window.triggerSearch = async function(q) {
        if (!q) return;
        currentSearchQuery = q; // 保存当前搜索关键词
        input.val(q); // 点击历史记录时更新输入框文字
        saveSearchHistory(q);
        $('#welcomeState, #emptyState').hide();
        $('#searchResults, #loadingMore').show();
        resultsGrid.empty();
        
        // 重置筛选条件
        currentSource = 'all';
        currentYear = 'all';
        currentTitleMask = 'all';
        isAsc = false;
        $('#searchSpinner').removeClass('hidden'); // 显示进度条旁边的转圈
        
        // 开始显示搜索进度
        showSearchProgress();
        
        try {
            const res = await $.get('/api/search', { q });
            // 停止进度模拟
            if (progressInterval) clearInterval(progressInterval);
            
            if (res.code === 200 && res.data.length) {
                rawResults = res.data;
                
                // 保存搜索状态到sessionStorage（用于返回时恢复）
                try {
                    sessionStorage.setItem('moontv_last_search_query', q);
                    // 尝试存储结果，如果失败则尝试精简存储，再失败则放弃
                    try {
                         sessionStorage.setItem('moontv_last_search_results', JSON.stringify(rawResults));
                    } catch (e) {
                        console.warn('搜索结果过大，尝试精简存储');
                        // 精简数据：只保留 UI 渲染必须的字段
                        const simplifiedResults = rawResults.map(item => ({
                            id: item.id,
                            source: item.source,
                            source_name: item.source_name,
                            title: item.title || item.vod_name,
                            poster: item.poster || item.vod_pic,
                            year: item.year || item.vod_year
                        }));
                        try {
                            sessionStorage.setItem('moontv_last_search_results', JSON.stringify(simplifiedResults));
                        } catch (e2) {
                            console.warn('搜索结果依然过大，放弃缓存结果', e2);
                            sessionStorage.removeItem('moontv_last_search_results');
                        }
                    }
                } catch (e) {
                    console.error('SessionStorage 写入失败:', e);
                }
                
                // 计算实际有结果的播放源数量
                const sourcesWithResults = [...new Set(rawResults.map(item => item.source_name || item.source))].length;
                updateSearchProgress(sourcesWithResults, totalSources);
                initFiltersUI();
                applyCombinedFilters();
            } else {
                $('#searchResults').hide();
                $('#emptyState').show();
                updateSearchProgress(0, totalSources);
            }
        } catch (e) {
            console.error(e);
            if (progressInterval) clearInterval(progressInterval);
            $('#searchProgress').text('搜索失败');
        } finally {
            $('#loadingMore').hide();
            $('#searchSpinner').addClass('hidden'); // 隐藏进度条旁边的转圈
        }
    };
    
    // 总播放源数量(从config.json获取,默认32个)
    let totalSources = 32;
    let progressInterval = null;
    
    // 获取播放源总数
    $.get('/api/config/sources').done(res => {
        if (res && res.length) {
            totalSources = res.length;
        }
    });
    
    // 显示搜索进度动画
    function showSearchProgress() {
        let current = 0;
        const duration = 2000; // 预计2秒完成搜索
        const steps = 20; // 分20步更新
        const increment = duration / steps;
        
        // 立即显示初始进度
        $('#searchSpinner').removeClass('hidden');
        updateSearchProgress(0, totalSources);
        
        // 清除旧的定时器
        if (progressInterval) {
            clearInterval(progressInterval);
        }
        
        // 模拟进度增长
        let stepCount = 0;
        progressInterval = setInterval(() => {
            stepCount++;
            // 使用非线性增长让进度看起来更真实
            let progress = Math.min(Math.floor((stepCount / steps) * totalSources), totalSources - 1);
            
            if (stepCount >= steps) {
                 clearInterval(progressInterval);
            } else {
                 updateSearchProgress(progress, totalSources);
            }
        }, increment);
    }
    
    // 更新搜索进度显示
    function updateSearchProgress(current, total) {
        $('#searchProgress').text(`${current}/${total}`);
    }

    // 检查是否从播放页返回（通过 referrer 判断）
    const isFromPlayPage = document.referrer && document.referrer.includes('/play/');
    
    // 检查 URL 参数并自动搜索
    const urlParams = new URLSearchParams(window.location.search);
    const searchQuery = urlParams.get('q');
    
    if (searchQuery) {
        // URL有参数，直接搜索（优先级最高）
        input.val(searchQuery);
        $('#clearSearchBtn').show();
        triggerSearch(searchQuery);
    } else if (isFromPlayPage) {
        // 从播放页返回，尝试恢复搜索状态
        const savedQuery = sessionStorage.getItem('moontv_last_search_query');
        const savedResults = sessionStorage.getItem('moontv_last_search_results');
        
        if (savedQuery && savedResults) {
            try {
                input.val(savedQuery);
                $('#clearSearchBtn').show();
                rawResults = JSON.parse(savedResults);
                currentSearchQuery = savedQuery;
                
                if (rawResults.length > 0) {
                    $('#welcomeState, #emptyState').hide();
                    $('#searchResults').show();
                    
                    // 恢复搜索结果
                    initFiltersUI();
                    applyCombinedFilters();
                    
                    // 更新搜索进度显示
                    const sourcesWithResults = [...new Set(rawResults.map(item => item.source_name || item.source))].length;
                    updateSearchProgress(sourcesWithResults, totalSources);
                    
                    console.log('从播放页返回，恢复搜索结果:', savedQuery, rawResults.length);
                }
            } catch (e) {
                console.error('恢复搜索状态失败:', e);
            }
        } else {
            // 没有缓存，显示空白搜索页
            input.val('');
            $('#clearSearchBtn').hide();
        }
    } else {
        // 从菜单或头部搜索进入，清空搜索框和缓存
        console.log('从菜单/头部进入搜索页，清空搜索状态');
        input.val('');
        $('#clearSearchBtn').hide();
        sessionStorage.removeItem('moontv_last_search_query');
        sessionStorage.removeItem('moontv_last_search_results');
        rawResults = [];
        currentSearchQuery = '';
    }

    // 输入框事件处理
    input.on('input', function() {
        const query = $(this).val().trim();
        $('#clearSearchBtn').toggle(!!query);
        
        // 如果有搜索结果,根据输入内容实时过滤建议
        if (rawResults.length > 0 && query.length > 0) {
            showFilteredSuggestions(query);
        } else if (rawResults.length > 0) {
            showSuggestionsFromResults();
        } else {
            hideSuggestions();
        }
    });
    
    // 聚焦时显示建议(如果有搜索结果)
    input.on('focus', function() {
        const query = $(this).val().trim();
        if (rawResults.length > 0) {
            if (query.length > 0) {
                showFilteredSuggestions(query);
            } else {
                showSuggestionsFromResults();
            }
        }
    });
    
    // 根据输入过滤并显示建议(从全部标题中匹配,限制显示20个)
    function showFilteredSuggestions(query) {
        if (rawResults.length === 0) {
            hideSuggestions();
            return;
        }
        
        // 如果currentSuggestions为空,异步加载全部标题
        if (currentSuggestions.length === 0) {
            currentSuggestions = [...new Set(rawResults.map(item => item.title || item.vod_name))];
        }
        
        // 从全部标题中过滤
        const queryLower = query.toLowerCase();
        const filteredTitles = currentSuggestions.filter(title =>
            title.toLowerCase().includes(queryLower)
        ).slice(0, 20); // 最多显示20个匹配结果
        
        if (filteredTitles.length > 0) {
            showSuggestions(filteredTitles);
        } else {
            hideSuggestions();
        }
    }
    
    $('#clearSearchBtn').click(() => {
        input.val('').focus();
        $('#clearSearchBtn').hide();
        hideSuggestions();
    });
    
    input.on('keypress', (e) => {
        if(e.which === 13) {
            hideSuggestions();
            const query = input.val().trim();
            
            // 检查是否可以先显示本地结果
            if (canFilterLocally(query)) {
                filterAndRefreshResults(query);
            } else {
                triggerSearch(query);
            }
        }
    });
    
    // 检查是否可以从本地结果筛选
    function canFilterLocally(query) {
        if (rawResults.length === 0 || !query) return false;
        
        // 获取所有标题
        const allTitles = [...new Set(rawResults.map(item => item.title || item.vod_name))];
        
        // 检查查询是否精确匹配某个标题,或者是现有结果的子集
        const queryLower = query.toLowerCase();
        const exactMatch = allTitles.some(title => title.toLowerCase() === queryLower);
        const isSubset = allTitles.some(title => title.toLowerCase().includes(queryLower));
        
        return exactMatch || isSubset;
    }
    
    // 先显示本地结果,然后后台刷新
    function filterAndRefreshResults(query) {
        const queryLower = query.toLowerCase();
        currentSearchQuery = query; // 更新当前搜索关键词
        
        // 1. 先筛选并显示本地结果
        const filtered = rawResults.filter(item => {
            const title = (item.title || item.vod_name).toLowerCase();
            return title.includes(queryLower) || title === queryLower;
        });
        
        if (filtered.length > 0) {
            // 立即显示本地结果
            $('#welcomeState, #emptyState').hide();
            $('#searchResults').show();
            
            // 临时切换到筛选结果
            const originalResults = rawResults;
            rawResults = filtered;
            
            // 显示筛选结果
            initFiltersUI();
            applyCombinedFilters();
            // 计算实际有结果的播放源数量
            const sourcesWithResults = [...new Set(rawResults.map(item => item.source_name || item.source))].length;
            updateSearchProgress(sourcesWithResults, totalSources);
            
            // 恢复原始结果
            rawResults = originalResults;
            
            // 2. 后台异步补充搜索最新数据(使用当前关键词)
            setTimeout(() => {
                triggerBackgroundSearch(query);  // 使用新的query而不是原来的
            }, 100);
        } else {
            // 如果没有匹配结果,执行完整搜索
            triggerSearch(query);
        }
    }
    
    // 后台补充搜索(不显示加载动画)
    async function triggerBackgroundSearch(q) {
        currentSearchQuery = q; // 更新当前搜索关键词
        try {
            const res = await $.get('/api/search', { q });
            if (res.code === 200 && res.data.length) {
                // 静默更新数据
                rawResults = res.data;
                currentSuggestions = [...new Set(rawResults.map(item => item.title || item.vod_name))];
                
                // 重新渲染(用户可能不会注意到变化,但数据已更新)
                initFiltersUI();
                applyCombinedFilters();
                // 计算实际有结果的播放源数量
                const sourcesWithResults = [...new Set(rawResults.map(item => item.source_name || item.source))].length;
                updateSearchProgress(sourcesWithResults, totalSources);
                
                // 保存到历史记录
                saveSearchHistory(q);
            }
        } catch (e) {
            console.log('后台刷新失败:', e);
            // 静默失败,不影响用户已看到的结果
        }
    }
    
    // 点击输入框外部隐藏建议
    $(document).on('click', function(e) {
        if (!$(e.target).closest('#pageSearchInput, #searchSuggestions').length) {
            hideSuggestions();
        }
    });
    
    // 从当前搜索结果中显示建议(只显示前20个)
    function showSuggestionsFromResults() {
        if (rawResults.length === 0) {
            hideSuggestions();
            return;
        }
        
        // 提取所有不重复的标题,但只显示前20个
        const allTitles = [...new Set(rawResults.map(item => item.title || item.vod_name))];
        const limitedTitles = allTitles.slice(0, 20);
        currentSuggestions = allTitles; // 保存全部,供过滤使用
        showSuggestions(limitedTitles);
    }
    
    // 显示搜索建议
    function showSuggestions(suggestions) {
        if (suggestions.length === 0) {
            hideSuggestions();
            return;
        }
        
        const html = suggestions.map(title =>
            `<div class="suggestion-item" onclick="selectSuggestion('${title.replace(/'/g, "\\'")}')">${title}</div>`
        ).join('');
        
        $('#suggestionsList').html(html);
        $('#searchSuggestions').removeClass('hidden');
    }
    
    // 隐藏搜索建议
    function hideSuggestions() {
        $('#searchSuggestions').addClass('hidden');
        currentSuggestions = [];
    }
    
    // 选择建议项
    window.selectSuggestion = function(title) {
        input.val(title);
        hideSuggestions();
        
        // 点击建议时也先显示本地结果,然后后台刷新
        if (canFilterLocally(title)) {
            filterAndRefreshResults(title);
        } else {
            triggerSearch(title);
        }
    };

    function initFiltersUI() {
        // 初始化所有筛选器（都基于原始搜索结果 rawResults）
        initSourceFilter();
        initTitleFilter();
        initYearFilter();
    }
    
    // 初始化标题筛选器（基于原始搜索结果）
    function initTitleFilter() {
        if (rawResults.length === 0) {
            $('#titleOptions').html('<div class="text-gray-400 text-xs p-2">暂无数据</div>');
            return;
        }
        
        // 从原始结果中提取所有不重复的标题
        const titles = [...new Set(rawResults.map(i => i.title || i.vod_name))];
        let tHtml = '<button class="filter-option active" data-type="title" data-value="all">全部标题</button>';
        titles.forEach(t => tHtml += `<button class="filter-option" data-type="title" data-value="${t}">${t}</button>`);
        $('#titleOptions').html(tHtml);
        
        // 绑定标题筛选事件
        $('#titleOptions .filter-option').off('click').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const val = $(this).data('value');
            $('#titleOptions .filter-option').removeClass('active');
            $(this).addClass('active');
            
            currentTitleMask = val;
            const isFiltered = val !== 'all';
            
            // 显示完整的标题名称
            $('#label-title').text(val === 'all' ? '标题' : val);
            
            // 更新按钮样式
            if (isFiltered) {
                $('#filter-title-btn').addClass('text-[#10b981] font-semibold');
                $('#label-title').addClass('text-[#10b981]');
                $('#title-arrow').removeClass('rotate-180');
            } else {
                $('#filter-title-btn').removeClass('text-[#10b981] font-semibold');
                $('#label-title').removeClass('text-[#10b981]');
                $('#title-arrow').addClass('rotate-180');
            }
            
            $('#titleOptions').addClass('hidden');
            
            // 检查是否需要重新搜索
            const currentQuery = input.val().trim();
            if (currentQuery && currentQuery !== currentSearchQuery) {
                triggerSearch(currentQuery);
            } else {
                applyCombinedFilters();
            }
        });
    }
    
    // 初始化年份筛选器（基于原始搜索结果）
    function initYearFilter() {
        if (rawResults.length === 0) {
            $('#yearOptions').html('<div class="text-gray-400 text-xs p-2">暂无数据</div>');
            return;
        }
        
        // 从原始结果中提取所有年份
        const years = [...new Set(rawResults.map(i => i.year || i.vod_year).filter(y => y > 1900))].sort((a,b) => b-a);
        let yHtml = '<button class="filter-option active" data-type="year" data-value="all">全部年份</button>';
        years.forEach(y => yHtml += `<button class="filter-option" data-type="year" data-value="${y}">${y}</button>`);
        $('#yearOptions').html(yHtml);
        
        // 绑定年份筛选事件
        $('#yearOptions .filter-option').off('click').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const val = $(this).data('value');
            $('#yearOptions .filter-option').removeClass('active');
            $(this).addClass('active');
            
            currentYear = val;
            const isFiltered = val !== 'all';
            
            $('#label-year').text(val === 'all' ? '年份' : val);
            
            // 更新按钮样式
            if (isFiltered) {
                $('#filter-year-btn').addClass('text-[#10b981] font-semibold');
                $('#label-year').addClass('text-[#10b981]');
                $('#year-arrow').removeClass('rotate-180');
            } else {
                $('#filter-year-btn').removeClass('text-[#10b981] font-semibold');
                $('#label-year').removeClass('text-[#10b981]');
                $('#year-arrow').addClass('rotate-180');
            }
            
            $('#yearOptions').addClass('hidden');
            
            // 检查是否需要重新搜索
            const currentQuery = input.val().trim();
            if (currentQuery && currentQuery !== currentSearchQuery) {
                triggerSearch(currentQuery);
            } else {
                applyCombinedFilters();
            }
        });
    }

    // 智能定位弹窗，防止溢出屏幕
    function positionDropdown(btn, dropdown) {
        const btnOffset = btn.offset();
        const btnHeight = btn.outerHeight();
        const btnWidth = btn.outerWidth();
        const dropdownWidth = dropdown.outerWidth();
        const windowWidth = $(window).width();
        const windowHeight = $(window).height();
        const isMobile = windowWidth < 768; // md breakpoint
        
        // 垂直位置：按钮下方
        let top = btnOffset.top + btnHeight + 8;
        
        // 水平位置计算
        let left;
        if (isMobile) {
            // 手机端：居中对齐按钮，但防止溢出
            left = btnOffset.left + (btnWidth / 2) - (dropdownWidth / 2);
            
            // 检查右边界，防止溢出
            if (left + dropdownWidth > windowWidth - 10) {
                left = windowWidth - dropdownWidth - 10;
            }
            
            // 检查左边界
            if (left < 10) {
                left = 10;
            }
        } else {
            // PC端：左对齐按钮
            left = btnOffset.left;
        }
        
        // 检查底部边界
        const dropdownHeight = dropdown.outerHeight();
        if (top + dropdownHeight > windowHeight - 10) {
            // 如果下方空间不足，尝试显示在按钮上方
            const topAlternative = btnOffset.top - dropdownHeight - 8;
            if (topAlternative > 10) {
                top = topAlternative;
            }
        }
        
        dropdown.css({
            top: top + 'px',
            left: left + 'px'
        });
    }
    
    // 筛选器下拉框点击切换 - 使用fixed定位需要动态计算位置
    $('#filter-source-btn').click(function(e) {
        e.stopPropagation();
        const isHidden = $('#sourceOptions').hasClass('hidden');
        
        if (isHidden) {
            $('#sourceOptions').removeClass('hidden');
            positionDropdown($(this), $('#sourceOptions'));
        } else {
            $('#sourceOptions').addClass('hidden');
        }
        
        $('#source-arrow').toggleClass('rotate-180', isHidden);
        $('#titleOptions, #yearOptions').addClass('hidden');
        $('#title-arrow, #year-arrow').addClass('rotate-180');
    });
    
    $('#filter-title-btn').click(function(e) {
        e.stopPropagation();
        const isHidden = $('#titleOptions').hasClass('hidden');
        
        if (isHidden) {
            $('#titleOptions').removeClass('hidden');
            positionDropdown($(this), $('#titleOptions'));
        } else {
            $('#titleOptions').addClass('hidden');
        }
        
        $('#title-arrow').toggleClass('rotate-180', isHidden);
        $('#sourceOptions, #yearOptions').addClass('hidden');
        $('#source-arrow, #year-arrow').addClass('rotate-180');
    });
    
    $('#filter-year-btn').click(function(e) {
        e.stopPropagation();
        const isHidden = $('#yearOptions').hasClass('hidden');
        
        if (isHidden) {
            $('#yearOptions').removeClass('hidden');
            positionDropdown($(this), $('#yearOptions'));
        } else {
            $('#yearOptions').addClass('hidden');
        }
        
        $('#year-arrow').toggleClass('rotate-180', isHidden);
        $('#sourceOptions, #titleOptions').addClass('hidden');
        $('#source-arrow, #title-arrow').addClass('rotate-180');
    });
    
    // 点击页面其他地方关闭所有下拉框
    $(document).click(function() {
        $('#sourceOptions, #titleOptions, #yearOptions').addClass('hidden');
        $('#source-arrow, #title-arrow, #year-arrow').addClass('rotate-180');
    });
    
    // 阻止下拉框内的点击事件冒泡（但不阻止按钮点击）
    $('#sourceOptions, #titleOptions, #yearOptions').click(function(e) {
        // 只阻止下拉框容器本身的冒泡，不阻止按钮
        if (e.target === this) {
            e.stopPropagation();
        }
    });

    $('#toggleSortBtn').click(function() { isAsc = !isAsc; $('#sortIcon').toggleClass('rotate-180'); applyCombinedFilters(); });
    
    // 重置筛选按钮
    $('#resetFiltersBtn').click(function() {
        // 重置所有筛选条件
        currentSource = 'all';
        currentYear = 'all';
        currentTitleMask = 'all';
        isAsc = false;
        
        // 重置UI状态
        $('#label-source').text('来源');
        $('#label-title').text('标题');
        $('#label-year').text('年份');
        
        // 重置按钮样式
        $('#filter-source-btn, #filter-title-btn, #filter-year-btn').removeClass('text-[#10b981] font-semibold');
        $('#label-source, #label-title, #label-year').removeClass('text-[#10b981]');
        $('#source-arrow, #title-arrow, #year-arrow').addClass('rotate-180');
        
        // 重置排序图标
        $('#sortIcon').removeClass('rotate-180');
        
        // 重置筛选选项的激活状态
        $('#sourceOptions .filter-option, #titleOptions .filter-option, #yearOptions .filter-option').removeClass('active');
        $('#sourceOptions .filter-option[data-value="all"], #titleOptions .filter-option[data-value="all"], #yearOptions .filter-option[data-value="all"]').addClass('active');
        
        // 应用筛选
        applyCombinedFilters();
    });

    function applyCombinedFilters() {
        console.log('应用筛选 - 当前筛选条件:', {
            source: currentSource,
            year: currentYear,
            title: currentTitleMask,
            totalResults: rawResults.length
        });
        
        // 检查是否有任何筛选条件被激活
        const hasActiveFilters = currentSource !== 'all' || currentYear !== 'all' || currentTitleMask !== 'all';
        
        // 更新重置按钮状态（可选：如果没有筛选条件，可以加半透明样式，或者保持常亮）
        if (hasActiveFilters) {
            $('#resetFiltersBtn').removeClass('opacity-50 grayscale');
        } else {
            $('#resetFiltersBtn').addClass('opacity-50 grayscale');
        }
        
        let f = [...rawResults];
        
        // 播放源筛选 - 使用source_name字段
        if(currentSource !== 'all') {
            const beforeCount = f.length;
            f = f.filter(i => {
                const sourceName = i.source_name || i.source || '';
                return sourceName === currentSource;
            });
            console.log(`播放源筛选 [${currentSource}]: ${beforeCount} -> ${f.length}`);
        }
        
        // 年份筛选
        if(currentYear !== 'all') {
            const beforeCount = f.length;
            f = f.filter(i => {
                const year = i.year || i.vod_year;
                return year == currentYear;
            });
            console.log(`年份筛选 [${currentYear}]: ${beforeCount} -> ${f.length}`);
        }
        
        // 标题筛选 - 使用更宽松的匹配，去除前后空格并标准化
        if(currentTitleMask !== 'all') {
            const beforeCount = f.length;
            const normalizedFilter = currentTitleMask.trim().toLowerCase();
            
            f = f.filter(i => {
                const title = (i.title || i.vod_name || '').trim();
                const normalizedTitle = title.toLowerCase();
                
                // 尝试精确匹配或包含匹配
                const exactMatch = normalizedTitle === normalizedFilter;
                const containsMatch = normalizedTitle.includes(normalizedFilter) || normalizedFilter.includes(normalizedTitle);
                
                if (beforeCount < 5 && !exactMatch && !containsMatch) {
                    console.log('标题不匹配:', {
                        itemTitle: title,
                        filterTitle: currentTitleMask,
                        normalizedItem: normalizedTitle,
                        normalizedFilter: normalizedFilter
                    });
                }
                
                return exactMatch || containsMatch;
            });
            
            console.log(`标题筛选 [${currentTitleMask}]: ${beforeCount} -> ${f.length}`);
            
            // 如果筛选后没有结果，输出调试信息
            if (f.length === 0) {
                const allTitles = [...new Set(rawResults.map(i => (i.title || i.vod_name || '').trim()))];
                console.error('标题筛选无结果！所有可用的标题:', allTitles.slice(0, 10));
                console.error('当前筛选的标题:', currentTitleMask);
            }
        }
        
        // 按年份排序
        f.sort((a,b) => {
            const yrA = parseInt(a.year || a.vod_year || 0);
            const yrB = parseInt(b.year || b.vod_year || 0);
            return isAsc ? yrA - yrB : yrB - yrA;
        });
        
        console.log('筛选后结果数量:', f.length);
        renderGrid(f);
        if(window.MoonLazy) window.MoonLazy.refresh();
    }

    function renderGrid(data) {
        // 按标题分组，统计每个视频有多少个播放源
        const groupedByTitle = {};
        data.forEach(it => {
            const title = it.title || it.vod_name;
            if (!groupedByTitle[title]) {
                groupedByTitle[title] = [];
            }
            groupedByTitle[title].push(it);
        });
        
        // 统计唯一视频数量
        const uniqueVideos = Object.keys(groupedByTitle).length;
        $('#resultsCount').text(`${uniqueVideos}/${rawResults.length}`);
        
        let h = '';
        // 对每个视频，选择第一个源作为主要显示
        Object.values(groupedByTitle).forEach(sources => {
            const it = sources[0]; // 使用第一个源
            const t = it.title || it.vod_name, r = it.year || '';
            const remarks = it.vod_remarks || it.remarks || ''; // 获取更新状态/备注
            const sourceCount = sources.length;
            
            h += `
            <a href="/play/${it.id}?source=${it.source}&title=${encodeURIComponent(t)}" class="block group animate-fade-in text-center relative transition-all duration-300 hover:z-20">
                <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-gray-100 shadow-sm transition-all duration-300 group-hover:shadow-2xl group-hover:-translate-y-1">
                    <!-- 绿色边框层 - 使用伪元素确保显示 -->
                    <div class="absolute inset-0 rounded-xl border-4 border-transparent group-hover:border-green-500 transition-all duration-300 pointer-events-none z-30"></div>
                    <img data-src="/api/image-proxy?url=${encodeURIComponent(it.poster || it.vod_pic)}&id=${it.id}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 opacity-0 transition-opacity duration-300" loading="lazy">
                    
                    <!-- 年份角标 -->
                    ${r ? `<div class="absolute top-1 right-1 px-1.5 py-0.5 bg-[#10b981] text-white text-[10px] font-bold rounded shadow-sm z-10 tracking-wide">${r}</div>` : ''}
                    
                    <!-- 备注/更新集数角标 -->
                    ${remarks ? `<div class="absolute bottom-1 right-1 px-1.5 py-0.5 bg-black/60 backdrop-blur-sm text-white text-[10px] font-medium rounded shadow-sm z-10 truncate max-w-[90%]">${remarks}</div>` : ''}
                    
                    <!-- 播放源数量角标 (如果有多个源) -->
                    ${sourceCount > 1 ? `<div class="absolute top-1 left-1 px-1.5 py-0.5 bg-blue-500 text-white text-[10px] font-bold rounded shadow-sm z-10">${sourceCount}源</div>` : ''}
                    
                    <!-- 遮罩与播放按钮 -->
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-center justify-center backdrop-blur-[2px]">
                        <div class="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center shadow-lg transform scale-50 group-hover:scale-100 transition-all duration-300 hover:bg-green-400">
                            <svg class="w-6 h-6 text-white fill-current ml-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                </div>
                
                <div class="mt-2 transition-all duration-300 group-hover:translate-y-1 px-1">
                    <h3 class="text-[11px] font-bold text-gray-800 line-clamp-1 group-hover:text-green-600 transition-colors tracking-tight">${t}</h3>
                    <p class="text-[10px] text-gray-500 mt-0.5">${it.source_name || it.source || '未知源'}</p>
                </div>
            </a>`;
        });
        resultsGrid.html(h);
    }

    loadSearchHistory();
    function loadSearchHistory() {
        const h = JSON.parse(localStorage.getItem('search_history') || '[]');
        if(h.length) {
            $('#historyTags').html(h.map((k, index) => `
                <span class="history-tag inline-flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm cursor-pointer hover:bg-gray-200 transition-colors relative group">
                    <span onclick="window.triggerSearch('${k}')" class="flex-1">${k}</span>
                    <button onclick="event.stopPropagation(); removeHistoryItem('${k}')"
                        class="close-btn hidden group-hover:flex w-4 h-4 items-center justify-center rounded-full bg-gray-400 text-white hover:bg-gray-500 transition-all absolute -top-1 -right-1">
                        <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </span>
            `).join(''));
            $('#searchHistory').removeClass('hidden');
        }
    }
    
    // 删除单个历史记录
    window.removeHistoryItem = function(keyword) {
        let h = JSON.parse(localStorage.getItem('search_history') || '[]');
        h = h.filter(i => i !== keyword);
        localStorage.setItem('search_history', JSON.stringify(h));
        loadSearchHistory();
        if(h.length === 0) {
            $('#searchHistory').addClass('hidden');
        }
    };
    function saveSearchHistory(k) {
        let h = JSON.parse(localStorage.getItem('search_history') || '[]');
        h = [k, ...h.filter(i => i !== k)].slice(0, 10);
        localStorage.setItem('search_history', JSON.stringify(h));
        loadSearchHistory();
    }
    window.clearSearchHistory = () => { localStorage.removeItem('search_history'); $('#searchHistory').addClass('hidden'); };
});
</script>
