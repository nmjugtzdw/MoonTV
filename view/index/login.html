{extend name="layout" /}

{block name="content"}
<div class="min-h-[calc(100vh-120px)] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
        <!-- 登录表单 - 毛玻璃效果 -->
        <div class="bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl backdrop-saturate-150 rounded-2xl shadow-xl p-6 sm:p-8 border border-gray-100/50 dark:border-gray-700/50">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6 text-center">登录</h2>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">用户名</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <input type="text" name="username" required
                               class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all text-gray-900 dark:text-white placeholder-gray-400"
                               placeholder="请输入用户名">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">密码</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input type="password" name="password" required
                               class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all text-gray-900 dark:text-white placeholder-gray-400"
                               placeholder="请输入密码">
                    </div>
                </div>
                
                <div id="loginError" class="hidden bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm rounded-lg p-3 flex items-center gap-2">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="loginErrorText"></span>
                </div>
                
                <button type="submit"
                        class="w-full py-3.5 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-green-500/30 hover:shadow-green-500/50 transform hover:scale-[1.02] active:scale-[0.98]">
                    登录
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600 dark:text-gray-400">
                    还没有账号？<a href="/register" class="text-green-600 dark:text-green-400 hover:text-green-700 dark:hover:text-green-300 font-semibold">立即注册</a>
                </p>
            </div>
        </div>

    </div>
</div>

<script>
$(document).ready(function() {
    $('#loginForm').on('submit', function(e) {
        e.preventDefault();
        
        const formData = {
            username: $('input[name="username"]').val(),
            password: $('input[name="password"]').val()
        };
        
        $.ajax({
            url: '/api/login',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function(res) {
                if (res.code === 200) {
                    // 保存 token
                    if (res.data && res.data.token) {
                        const token = res.data.token;
                        localStorage.setItem('auth_token', token);
                        
                        // 设置 cookie（7天有效期，与后端一致）
                        const expires = new Date();
                        expires.setTime(expires.getTime() + 7 * 24 * 60 * 60 * 1000);
                        document.cookie = 'auth_token=' + token +
                            ';expires=' + expires.toUTCString() +
                            ';path=/;SameSite=Lax';
                    }
                    // 跳转到首页或返回页
                    const returnUrl = new URLSearchParams(window.location.search).get('return') || '/';
                    window.location.href = returnUrl;
                } else {
                    $('#loginErrorText').text(res.msg || '登录失败');
                    $('#loginError').removeClass('hidden');
                }
            },
            error: function(xhr) {
                const res = xhr.responseJSON || {};
                $('#loginErrorText').text(res.msg || '网络错误，请重试');
                $('#loginError').removeClass('hidden');
            }
        });
    });
});
</script>
{/block}
