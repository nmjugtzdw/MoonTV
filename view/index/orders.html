{extend name="layout" /}

{block name="content"}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button onclick="history.back()" class="md:hidden p-1 -ml-1 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full" title="返回">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 class="text-xl md:text-2xl font-bold text-gray-800 dark:text-white">我的订单</h2>
            </div>
            <a href="/user" class="text-sm text-gray-500 hover:text-green-600 dark:text-gray-400 dark:hover:text-green-400 hidden md:block">返回个人中心</a>
        </div>

        <!-- 筛选区域 -->
        <div class="space-y-3">
            <!-- 支付方式筛选 -->
            <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar">
                <span class="text-xs font-bold text-gray-500 flex-shrink-0 w-10">方式</span>
                <button onclick="setFilter('payType', '')" data-group="payType" data-value="" data-active="true" class="filter-tab px-3 py-1 rounded-full text-xs font-medium transition-colors whitespace-nowrap bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 data-[active=true]:bg-green-600 data-[active=true]:text-white">全部</button>
                <button onclick="setFilter('payType', 'wxpay')" data-group="payType" data-value="wxpay" class="filter-tab px-3 py-1 rounded-full text-xs font-medium transition-colors whitespace-nowrap bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 data-[active=true]:bg-green-600 data-[active=true]:text-white">微信</button>
                <button onclick="setFilter('payType', 'alipay')" data-group="payType" data-value="alipay" class="filter-tab px-3 py-1 rounded-full text-xs font-medium transition-colors whitespace-nowrap bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 data-[active=true]:bg-green-600 data-[active=true]:text-white">支付宝</button>
            </div>

            <!-- 日期筛选 -->
            <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar">
                <span class="text-xs font-bold text-gray-500 flex-shrink-0 w-10">时间</span>
                <button onclick="setFilter('date', '')" data-group="date" data-value="" data-active="true" class="filter-tab px-3 py-1 rounded-full text-xs font-medium transition-colors whitespace-nowrap bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 data-[active=true]:bg-green-600 data-[active=true]:text-white">全部</button>
                <button onclick="setFilter('date', '1month')" data-group="date" data-value="1month" class="filter-tab px-3 py-1 rounded-full text-xs font-medium transition-colors whitespace-nowrap bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 data-[active=true]:bg-green-600 data-[active=true]:text-white">一个月</button>
                <button onclick="setFilter('date', '3months')" data-group="date" data-value="3months" class="filter-tab px-3 py-1 rounded-full text-xs font-medium transition-colors whitespace-nowrap bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 data-[active=true]:bg-green-600 data-[active=true]:text-white">三个月</button>
                <button onclick="setFilter('date', 'earlier')" data-group="date" data-value="earlier" class="filter-tab px-3 py-1 rounded-full text-xs font-medium transition-colors whitespace-nowrap bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 data-[active=true]:bg-green-600 data-[active=true]:text-white">更早</button>
            </div>
        </div>
    </div>

    <!-- 订单列表 -->
    <div class="space-y-3" id="orderList">
        <div class="text-center py-10 text-gray-500 dark:text-gray-400">加载中...</div>
    </div>
    
    <!-- 分页 -->
    <div class="flex justify-center mt-6" id="pagination"></div>
</div>

<style>
    .filter-tab[data-active="true"] {
        background-color: #16a34a;
        color: white;
    }
</style>
<script>
let currentFilters = {
    payType: '',
    date: ''
};

$(document).ready(function() {
    loadOrders(1);
});

function setFilter(type, value) {
    currentFilters[type] = value;
    
    $(`button[data-group="${type}"]`).removeAttr('data-active');
    $(`button[data-group="${type}"][data-value="${value}"]`).attr('data-active', 'true');
    
    loadOrders(1);
}

function loadOrders(page) {
    const token = localStorage.getItem('auth_token') || getCookie('auth_token');
    if (!token) {
        window.location.href = '/login';
        return;
    }

    // 构建查询参数
    let url = '/api/orders?page=' + page + '&token=' + encodeURIComponent(token);
    
    if (currentFilters.payType) {
        url += '&pay_type=' + currentFilters.payType;
    }
    
    if (currentFilters.date) {
        url += '&date=' + currentFilters.date;
    }

    if (page === 1) {
        $('#orderList').html('<div class="text-center py-10 text-gray-400">加载中...</div>');
    }

    $.ajax({
        url: url,
        method: 'GET',
        headers: {'Authorization': 'Bearer ' + token},
        success: function(res) {
            if (res.code === 200) {
                renderOrders(res.data.data);
                renderPagination(res.data);
            } else {
                $('#orderList').html('<div class="text-center py-10 text-red-500">加载失败</div>');
            }
        },
        error: function() {
            $('#orderList').html('<div class="text-center py-10 text-red-500">网络请求失败</div>');
        }
    });
}

function renderOrders(list) {
    if (!list || list.length === 0) {
        $('#orderList').html(`
            <div class="flex flex-col items-center justify-center py-12 text-gray-400">
                <svg class="w-16 h-16 mb-4 text-gray-200 dark:text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <p>暂无符合条件的订单</p>
            </div>
        `);
        return;
    }

    let html = '';
    list.forEach(order => {
        const isSuccess = order.status == 1;
        const statusClass = isSuccess ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400';
        const statusText = isSuccess ? '支付成功' : '待支付';
        
        html += `
            <div class="bg-white dark:bg-gray-800 rounded-lg p-3 shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between gap-3 relative overflow-hidden group hover:border-green-500/30 transition-colors">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                        <div class="text-sm font-bold text-gray-800 dark:text-white truncate">${order.package_name}</div>
                        <div class="px-1.5 py-0.5 rounded text-[10px] font-medium ${statusClass}">
                            ${statusText}
                        </div>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-gray-400 dark:text-gray-500 font-mono">
                        <span>${formatTime(order.created_at || order.create_time)}</span>
                        <span class="w-px h-2 bg-gray-200 dark:bg-gray-700"></span>
                        <span class="truncate">NO.${order.order_no}</span>
                    </div>
                </div>
                <div class="text-base font-bold text-gray-900 dark:text-gray-100 whitespace-nowrap">¥${order.amount}</div>
            </div>
        `;
    });
    $('#orderList').html(html);
}
    
    function renderPagination(data) {
        if (data.last_page <= 1) {
            $('#pagination').empty();
            return;
        }
        
        // Simple pagination
        let html = `
            <div class="flex gap-2">
                <button onclick="loadOrders(${data.current_page - 1})" ${data.current_page === 1 ? 'disabled' : ''} class="px-3 py-1 bg-white dark:bg-gray-800 border dark:border-gray-600 rounded ${data.current_page===1 ? 'opacity-50' : 'hover:bg-gray-50 dark:hover:bg-gray-700'} text-sm">上一页</button>
                <button onclick="loadOrders(${data.current_page + 1})" ${data.current_page === data.last_page ? 'disabled' : ''} class="px-3 py-1 bg-white dark:bg-gray-800 border dark:border-gray-600 rounded ${data.current_page===data.last_page ? 'opacity-50' : 'hover:bg-gray-50 dark:hover:bg-gray-700'} text-sm">下一页</button>
            </div>
        `;
        $('#pagination').html(html);
    }

    function formatTime(time) {
        if (!time) return '-';
        // 如果是数字时间戳，转换它
        if (/^\d+$/.test(time)) {
            const date = new Date(parseInt(time) * 1000);
            return date.getFullYear() + '-' +
                String(date.getMonth() + 1).padStart(2, '0') + '-' +
                String(date.getDate()).padStart(2, '0') + ' ' +
                String(date.getHours()).padStart(2, '0') + ':' +
                String(date.getMinutes()).padStart(2, '0') + ':' +
                String(date.getSeconds()).padStart(2, '0');
        }
        return time;
    }
</script>
{/block}
