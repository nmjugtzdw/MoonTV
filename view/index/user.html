{extend name="layout" /}

{block name="content"}
<div class="max-w-4xl mx-auto space-y-4 sm:space-y-6">
    <!-- 移动端顶部标题栏 -->
    <div class="flex items-center gap-3 md:hidden pt-2 pl-2">
        <button onclick="history.back()" class="p-2 -ml-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition-colors" title="返回">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="text-xl font-bold text-gray-900 dark:text-white">个人中心</h1>
    </div>

    <!-- 用户信息卡片 -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-4 sm:p-6 border border-gray-100 dark:border-gray-700">
        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
            <div class="flex items-center gap-4 flex-1 min-w-0">
                <div class="relative flex-shrink-0">
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-gradient-to-br from-green-400 to-green-600 flex items-center justify-center text-white text-lg sm:text-xl font-bold shadow-lg ring-2 ring-white dark:ring-gray-800">
                        <span id="userAvatar">U</span>
                    </div>
                    <div class="absolute bottom-0 right-0 w-5 h-5 sm:w-6 sm:h-6 bg-gray-100 dark:bg-gray-700 rounded-full border-2 border-white dark:border-gray-800 flex items-center justify-center text-[10px]" id="vipBadge">
                        <svg class="w-2.5 h-2.5 sm:w-3 sm:h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                </div>
                
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <h1 class="text-base sm:text-lg font-bold text-gray-900 dark:text-white truncate" id="username">加载中...</h1>
                        <span id="vipTag" class="hidden px-1.5 py-0.5 bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 text-[10px] leading-none rounded font-medium border border-orange-200 dark:border-orange-800">VIP</span>
                    </div>
                    <div class="flex flex-col gap-0.5 text-xs sm:text-sm text-gray-500 dark:text-gray-400">
                        <p class="font-mono">UID: <span id="userId">--</span></p>
                        <p class="truncate"><span id="registerTimeLabel">VIP到期:</span> <span id="registerTime" class="text-orange-500 font-bold">--</span></p>
                    </div>
                </div>
            </div>
            
            <div class="flex-shrink-0 w-full sm:w-auto">
                 <a href="/vip" class="block sm:inline-block px-6 py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-lg text-sm font-bold shadow-md hover:shadow-lg hover:scale-105 transition-all whitespace-nowrap text-center">
                    <span id="vipBtnText">续费会员</span>
                </a>
            </div>
        </div>

        <!-- 卡密兑换区域 -->
        <div class="mt-3 pt-3 border-t border-gray-100 dark:border-gray-700">
            <div class="flex gap-2 max-w-sm">
                <input type="text" id="cdkInput" placeholder="输入卡密兑换" class="flex-1 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 px-3 py-2">
                <button onclick="redeemCdk()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors whitespace-nowrap">
                    立即兑换
                </button>
            </div>
        </div>
    </div>

    <!-- 菜单列表 (移动端优化) -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden divide-y divide-gray-100 dark:divide-gray-700">
        <!-- 观看记录 -->
        <a href="/history" class="flex items-center gap-3 p-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group">
            <div class="w-8 h-8 rounded-full bg-green-50 dark:bg-green-900/20 flex items-center justify-center text-green-600 dark:text-green-400 flex-shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <span class="text-sm font-bold text-gray-800 dark:text-white flex-1">观看记录</span>
            <svg class="w-4 h-4 text-gray-300 group-hover:text-green-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>
        
        <!-- 我的收藏 -->
        <div onclick="toggleFavoriteTab()" class="flex items-center gap-3 p-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group cursor-pointer">
             <div class="w-8 h-8 rounded-full bg-red-50 dark:bg-red-900/20 flex items-center justify-center text-red-600 dark:text-red-400 flex-shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </div>
            <span class="text-sm font-bold text-gray-800 dark:text-white flex-1">我的收藏</span>
            <svg class="w-4 h-4 text-gray-300 group-hover:text-red-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </div>

        <!-- 订单查询 -->
        <a href="/orders" class="flex items-center gap-3 p-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group">
            <div class="w-8 h-8 rounded-full bg-purple-50 dark:bg-purple-900/20 flex items-center justify-center text-purple-600 dark:text-purple-400 flex-shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            </div>
            <span class="text-sm font-bold text-gray-800 dark:text-white flex-1">订单查询</span>
            <svg class="w-4 h-4 text-gray-300 group-hover:text-purple-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>

        <!-- 账户安全 -->
        <div class="flex items-center gap-3 p-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group" onclick="openPasswordModal()">
             <div class="w-8 h-8 rounded-full bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-blue-600 dark:text-blue-400 flex-shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <span class="text-sm font-bold text-gray-800 dark:text-white flex-1">修改密码</span>
            <svg class="w-4 h-4 text-gray-300 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        checkUserStatus();
    });

    function checkUserStatus() {
        // Reuse global checkLoginStatus logic or simpler direct check if we are on user page
        // Since we are already on user page, we might want to ensure we have fresh data
        const token = localStorage.getItem('auth_token') || getCookie('auth_token');
        if (!token) {
            window.location.href = '/login';
            return;
        }

        // Just use the info we might already have from layout, or fetch if needed
        // But layout fetch is async. Let's fetch specifically for this page to fill details
        $.ajax({
            url: '/api/user/info',
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function(res) {
                if (res.code === 200) {
                    renderUserInfo(res.data);
                } else {
                    // clearAuth(); // Layout handles this
                    // window.location.href = '/login';
                }
            }
        });
    }

    function renderUserInfo(user) {
        $('#username').text(user.username);
        $('#userId').text(user.id);
        $('#userAvatar').text(user.username ? user.username.substring(0, 1).toUpperCase() : 'U');
        
        // 尝试显示注册时间，同时兼顾 create_time 和 created_at
        let regTime = user.create_time || user.created_at || null;
        
        if (user.is_vip && user.vip_expire_time) {
            $('#registerTimeLabel').text('VIP到期:');
            $('#registerTime').text(user.vip_expire_time).addClass('text-orange-500 font-bold');
        } else {
            $('#registerTimeLabel').text('注册时间:');
             $('#registerTime').text(regTime || '未知').removeClass('text-orange-500 font-bold');
        }
        
        if (user.is_vip) {
            $('#vipTag').removeClass('hidden');
            $('#vipBadge').removeClass('bg-gray-100 dark:bg-gray-700 border-white dark:border-gray-800').addClass('bg-orange-500 border-orange-200').html('<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>');
            $('#vipBtnText').text('续费会员');
        } else {
            $('#vipBtnText').text('开通会员');
        }
    }

    function redeemCdk() {
        const code = $('#cdkInput').val();
        if (!code) {
            alert('请输入卡密');
            return;
        }

        const token = localStorage.getItem('auth_token') || getCookie('auth_token');
        const btn = $('button[onclick="redeemCdk()"]');
        btn.prop('disabled', true).text('兑换中...');

        $.ajax({
            url: '/api/vip/redeem',
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            data: { code: code },
            success: function(res) {
                if (res.code === 200) {
                    alert('兑换成功！增加 ' + res.data.added_days + ' 天VIP');
                    location.reload();
                } else {
                    alert(res.msg || '兑换失败');
                }
            },
            complete: function() {
                btn.prop('disabled', false).text('立即兑换');
            }
        });
    }
    
    function toggleFavoriteTab() {
        window.location.href = '/?type=favorites';
    }
    
    // openPasswordModal and updatePassword are now in layout.html
</script>
{/block}
