{extend name="layout" /}

{block name="content"}
<div id="detail-container" class="bg-white rounded-2xl shadow-sm p-8 border border-gray-100">
    <div class="text-center py-16 text-gray-500">
        <svg class="animate-spin h-10 w-10 text-green-600 mx-auto mb-3" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        加载中...
    </div>
</div>

<script>
    $(document).ready(function() {
        const id = '{$id}';
        
        const source = new URLSearchParams(window.location.search).get('source') || '';
        
        $.ajax({
            url: '/api/detail',
            data: { id: id, source: source },
            success: function(res) {
                if (res.code === 200 && res.data) {
                    const data = res.data;
                    // 兼容新旧数据格式
                    const title = data.title || data.vod_name || '未知标题';
                    const poster = data.poster || data.vod_pic || '';
                    const year = data.year || data.vod_year || '未知年份';
                    const area = data.area || data.vod_area || '';
                    const classType = data.class || data.vod_class || data.type_name || '未知类型';
                    const desc = data.desc || data.vod_content || '暂无简介';
                    const videoId = data.id || data.vod_id || '';
                    const source = data.source || '';
                    
                    // 处理播放列表：从episodes转换为vod_play_list格式
                    let playList = [];
                    if (data.episodes && data.episodes.length > 0) {
                        // 新格式：episodes数组
                        playList = [{
                            from: data.source_name || source || '默认源',
                            urls: data.episodes.map((url, idx) => ({
                                name: (data.episodes_titles && data.episodes_titles[idx]) || `第${idx + 1}集`,
                                url: url
                            }))
                        }];
                    } else if (data.vod_play_list && data.vod_play_list.length > 0) {
                        // 旧格式：vod_play_list
                        playList = data.vod_play_list;
                    }
                    
                    let html = `
                        <div class="flex flex-col md:flex-row gap-8">
                            <div class="w-full md:w-1/3 lg:w-1/4 flex-shrink-0">
                                <div class="aspect-[2/3] rounded-2xl overflow-hidden bg-gray-200 shadow-lg">
                                    <img data-src="${poster}" alt="${title}" class="w-full h-full object-cover opacity-0 transition-opacity duration-300" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQ1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQ1MCIgZmlsbD0iI2U1ZTdlYiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM5Y2EzYWYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj7lm77niYfliqDovb3lpLHotKU8L3RleHQ+PC9zdmc+'" loading="lazy">
                                </div>
                            </div>
                            <div class="flex-1">
                                <h1 class="text-3xl font-bold text-gray-900 mb-3">${title}</h1>
                                <div class="text-gray-500 text-sm mb-5 flex items-center gap-2">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">${year}</span>
                                    ${area ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">' + area + '</span>' : ''}
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800">${classType}</span>
                                </div>
                                <div class="prose max-w-none text-gray-600 mb-6 line-clamp-4 leading-relaxed">
                                    ${desc.replace(new RegExp('<[^' + '>]+' + '>', 'g'), '') || '暂无简介'}
                                </div>
                                
                                <div class="flex gap-4">
                                    ${playList.length > 0 ? `<a href="/play/${videoId}?source=${source}&sid=0&nid=0" class="px-8 py-3 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white rounded-full font-medium transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">立即播放</a>` : ''}
                                </div>
                            </div>
                        </div>
                        
                        <!-- 选集 -->
                        <div class="mt-8 border-t border-gray-100 pt-8">
                            <h2 class="text-xl font-bold mb-5 flex items-center">
                                <span class="w-1 h-6 bg-green-500 rounded-full mr-3"></span>
                                选集
                            </h2>
                            <div class="space-y-5">
                    `;
                    
                    if (playList.length > 0) {
                        playList.forEach((source, sid) => {
                            html += `
                                <div>
                                    <h3 class="text-sm font-semibold text-gray-700 mb-3 flex items-center">
                                        <span class="w-2 h-4 bg-green-500 rounded-full mr-2"></span>
                                        ${source.from || '默认源'}
                                    </h3>
                                    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2">
                            `;
                            
                            // 处理urls（可能是数组或字符串）
                            let urls = [];
                            if (Array.isArray(source.urls)) {
                                urls = source.urls;
                            } else if (typeof source.urls === 'string') {
                                urls = source.urls.split('#').map(u => {
                                    const p = u.split('$');
                                    return { name: p[0] || '', url: p[1] || '' };
                                });
                            }
                            
                            urls.forEach((ep, nid) => {
                                const epName = ep.name || (typeof ep === 'string' ? ep : `第${nid + 1}集`);
                                const epUrl = ep.url || (typeof ep === 'string' ? ep : '');
                                html += `
                                    <a href="/play/${videoId}?source=${source.from || source}&sid=${sid}&nid=${nid}" class="block text-center px-3 py-2.5 border-2 rounded-lg hover:border-green-500 hover:text-green-600 text-sm font-medium truncate bg-gray-50 hover:bg-green-50 transition-all hover:shadow-md">
                                        ${epName}
                                    </a>
                                `;
                            });
                            
                            html += `</div></div>`;
                        });
                    } else {
                        html += '<div class="text-gray-400">暂无播放源</div>';
                    }
                    
                    html += `</div></div>`;
                    
                    $('#detail-container').html(html);
                    if(window.MoonLazy) window.MoonLazy.refresh();
                } else {
                    $('#detail-container').html('<div class="text-center py-16 text-gray-500">获取详情失败</div>');
                }
            },
            error: function() {
                $('#detail-container').html('<div class="text-center py-16 text-red-500">网络错误</div>');
            }
        });
    });
</script>
{/block}
