{extend name="layout" /}

{block name="content"}
<div class="space-y-6">
    <div class="max-w-4xl mx-auto space-y-4 sm:space-y-6">
        <!-- 头部标题区 (简化版) -->
        <div class="px-2 pt-2">
            <div class="flex items-center gap-2">
                <button onclick="history.back()" class="md:hidden p-1 -ml-1 text-gray-500 hover:bg-gray-100 rounded-full" title="返回">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h1 class="text-xl md:text-2xl font-bold text-gray-800 flex items-center gap-2">
                    <span class="text-green-600">VIP</span>会员中心
                </h1>
            </div>
        </div>

        <!-- 套餐列表区 -->
        <div class="bg-white rounded-xl shadow-sm p-4 sm:p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-800">选择套餐</h2>
                <span class="text-xs text-green-600 bg-green-50 px-2 py-1 rounded-full font-medium">超值推荐</span>
            </div>
            
            <!-- 移动端网格布局优化：2列紧凑布局 -->
            <div id="vip-packages" class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-6">
                <div class="col-span-full py-12 text-center text-gray-400">
                    <svg class="w-8 h-8 mx-auto mb-2 animate-spin text-green-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    正在加载套餐...
                </div>
            </div>
        </div>

        <!-- 卡密兑换区 -->
        <div class="bg-white rounded-xl shadow-sm p-4 sm:p-6">
            <h2 class="text-base sm:text-lg font-bold mb-3 text-gray-800 flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
                已有卡密？
            </h2>
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <input type="text" id="cdk-input" placeholder="输入兑换码"
                           class="w-full pl-3 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-green-500 focus:border-green-500 transition-all">
                </div>
                <button onclick="redeemCdk()" class="px-4 py-2 bg-gray-900 hover:bg-gray-800 active:bg-black text-white rounded-lg text-sm font-medium transition-colors whitespace-nowrap shadow-lg shadow-gray-200">
                    立即兑换
                </button>
            </div>
        </div>
    </div>

    <!-- 支付方式选择模态框 (Bottom Sheet 风格) -->
    <div id="payModal" class="fixed inset-0 z-50 hidden flex items-center justify-center" role="dialog" aria-modal="true">
        <!-- 背景遮罩 -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0" id="payModalOverlay" onclick="closePayModal()"></div>
        
        <!-- 内容区域：改为居中显示，避免被 BottomBar 遮挡 -->
        <div class="relative bg-white rounded-2xl w-[90%] sm:w-[380px] transform transition-all scale-95 opacity-0 shadow-2xl" id="payModalContent">
            <div class="p-5">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-lg font-bold text-gray-900">选择支付方式</h3>
                    <button onclick="closePayModal()" class="p-1 rounded-full hover:bg-gray-100 text-gray-400 transition-colors" title="关闭">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="space-y-3 mb-6">
                    <!-- 微信支付 (默认) -->
                    <label class="relative flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-green-500 hover:bg-green-50/30 transition-all group">
                        <input type="radio" name="payType" value="wxpay" checked class="peer sr-only">
                        <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-500 mr-3 shrink-0">
                             <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.5 14H8v-1.5h8.5V16zm0-3H8v-1.5h8.5V13zm0-3H8V8.5h8.5V10z"/></svg>
                        </div>
                        <div class="flex-1">
                            <div class="font-bold text-gray-900 peer-checked:text-green-600">微信支付</div>
                        </div>
                        <div class="w-5 h-5 rounded-full border-2 border-gray-300 peer-checked:border-green-500 peer-checked:bg-green-500 flex items-center justify-center transition-all">
                            <svg class="w-3 h-3 text-white hidden peer-checked:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-green-500 pointer-events-none"></div>
                    </label>

                    <!-- 支付宝 -->
                    <label class="relative flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:border-blue-500 hover:bg-blue-50/30 transition-all group">
                        <input type="radio" name="payType" value="alipay" class="peer sr-only">
                        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-500 mr-3 shrink-0">
                             <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M5.5 2C3.567 2 2 3.567 2 5.5v13C2 20.433 3.567 22 5.5 22h13c1.933 0 3.5-1.567 3.5-3.5v-13c0-1.933-1.567-3.5-3.5-3.5h-13zM18 17h-2v-2h-2v2H8v-2H6v2H4v-4h2v-2h2v2h2v-2h2v2h2v4z"/></svg>
                        </div>
                        <div class="flex-1">
                            <div class="font-bold text-gray-900 peer-checked:text-blue-600">支付宝</div>
                        </div>
                        <div class="w-5 h-5 rounded-full border-2 border-gray-300 peer-checked:border-blue-500 peer-checked:bg-blue-500 flex items-center justify-center transition-all">
                            <svg class="w-3 h-3 text-white hidden peer-checked:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-blue-500 pointer-events-none"></div>
                    </label>
                </div>

                <button onclick="confirmPay()" class="w-full py-3 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 active:scale-[0.98] text-white rounded-xl font-bold shadow-lg shadow-green-200 transition-all flex items-center justify-center gap-2">
                    <span>立即支付</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let selectedPackageId = null;

$(document).ready(function() {
    loadPackages();
});

function loadPackages() {
    $.ajax({
        url: '/api/vip/packages',
        success: function(res) {
            if (res.code === 200 && res.data && res.data.length > 0) {
                let html = '';
                res.data.forEach(function(pkg) {
                    // 计算折扣
                    let discountLabel = '';
                    if (pkg.original_price && pkg.price < pkg.original_price) {
                        const discount = Math.round((pkg.price / pkg.original_price) * 100) / 10;
                         // 不显示具体折扣，只显示立省金额，更直观
                         const save = (pkg.original_price - pkg.price).toFixed(0);
                         if (save > 0) discountLabel = `<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded ml-1">省¥${save}</span>`;
                    }
                    
                    html += `
                        <div onclick="openPayModal(${pkg.id})"
                             class="relative flex flex-col justify-between p-3 sm:p-5 rounded-2xl border transition-all cursor-pointer group active:scale-95 bg-white
                                    ${pkg.is_hot ? 'border-green-500 bg-green-50/30 ring-1 ring-green-100' : 'border-gray-200 hover:border-green-300'}">
                             
                             ${pkg.is_hot ? '<div class="absolute -top-px -right-px bg-gradient-to-r from-green-500 to-green-600 text-white text-[10px] px-2 py-0.5 rounded-bl-lg rounded-tr-lg font-bold shadow-sm z-10">推荐</div>' : ''}
                             
                             <div class="space-y-1">
                                <h3 class="font-bold text-gray-800 text-sm sm:text-base line-clamp-1">${pkg.name}</h3>
                                <div class="flex items-baseline gap-0.5 leading-none">
                                    <span class="text-xs text-green-600 font-bold">¥</span>
                                    <span class="text-2xl sm:text-3xl font-extrabold text-green-600 tracking-tight">${pkg.price}</span>
                                    ${pkg.original_price ? `<span class="text-xs transform scale-90 text-gray-300 line-through ml-1">¥${pkg.original_price}</span>` : ''}
                                </div>
                                <div class="min-h-[1.25rem]">
                                    ${discountLabel}
                                </div>
                             </div>

                             <div class="mt-2 sm:mt-3 flex items-center justify-between border-t border-gray-50 pt-2 sm:pt-3">
                                <div class="text-xs text-gray-400 font-medium whitespace-nowrap">${pkg.days}天有效</div>
                                <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-green-50 text-green-600 flex items-center justify-center group-hover:bg-green-500 group-hover:text-white transition-colors shadow-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                </div>
                             </div>
                        </div>
                    `;
                });
                $('#vip-packages').html(html);
            } else {
                $('#vip-packages').html('<div class="col-span-full py-10 text-center text-gray-400 bg-gray-50 rounded-xl">暂无可用套餐</div>');
            }
        },
        error: function() {
            $('#vip-packages').html('<div class="col-span-full py-10 text-center text-red-400 bg-red-50 rounded-xl">套餐加载失败</div>');
        }
    });
}

function openPayModal(packageId) {
    const token = localStorage.getItem('auth_token') || getCookie('auth_token');
    if (!token) {
        window.location.href = '/login';
        return;
    }
    selectedPackageId = packageId;
    
    // 显示 Modal (Flex 居中)
    $('#payModal').removeClass('hidden');
    
    // reflow
    void document.getElementById('payModalOverlay').offsetWidth;
    
    $('#payModalOverlay').removeClass('opacity-0');
    // 统一使用 scale 动画
    $('#payModalContent').removeClass('opacity-0 scale-95').addClass('scale-100');
}

function closePayModal() {
    $('#payModalOverlay').addClass('opacity-0');
    $('#payModalContent').addClass('opacity-0 scale-95').removeClass('scale-100');
    
    setTimeout(() => {
        $('#payModal').addClass('hidden');
        selectedPackageId = null;
    }, 300);
}

function confirmPay() {
    if (!selectedPackageId) return;
    
    const payType = $('input[name="payType"]:checked').val();
    const token = localStorage.getItem('auth_token') || getCookie('auth_token');
    
    const btn = $('#payModal button:last-child');
    const originalText = btn.text();
    btn.prop('disabled', true).text('处理中...');
    
    $.ajax({
        url: '/api/vip/order/create',
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        data: {
            package_id: selectedPackageId,
            pay_type: payType
        },
        success: function(res) {
            if (res.code === 200) {
                // 跳转到支付页面
                window.location.href = res.data.pay_url;
            } else {
                alert(res.msg || '创建订单失败');
            }
        },
        error: function() {
            alert('请求失败，请稍后重试');
        },
        complete: function() {
            btn.prop('disabled', false).text(originalText);
            closePayModal();
        }
    });
}

function redeemCdk() {
    const code = $('#cdk-input').val().trim();
    if (!code) {
        alert('请输入卡密');
        return;
    }
    
    // 检查登录
    const token = localStorage.getItem('auth_token') || getCookie('auth_token');
    if (!token) {
        window.location.href = '/login';
        return;
    }
    
    const btn = $('button[onclick="redeemCdk()"]');
    const originalText = btn.text();
    btn.prop('disabled', true).text('兑换中...');
    
    $.ajax({
        url: '/api/vip/redeem',
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        data: { code: code },
        success: function(res) {
            if (res.code === 200) {
                alert('兑换成功！您的VIP有效期至：' + res.data.expire_time);
                $('#cdk-input').val('');
                // 刷新用户信息（如果需要）
                // window.location.reload();
            } else {
                alert(res.msg || '兑换失败');
            }
        },
        error: function() {
            alert('兑换请求失败');
        },
        complete: function() {
            btn.prop('disabled', false).text(originalText);
        }
    });
}
</script>
{/block}
