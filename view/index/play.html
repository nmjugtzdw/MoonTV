{extend name="layout" /}

{block name="content"}
<div class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    <div class="relative w-full max-w-[1920px] mx-auto min-h-screen">
        <!-- 左侧内容区：动态根据侧边栏状态调整右边距 -->
        <div id="left-content" class="w-full flex flex-col gap-4 p-3 lg:p-6 lg:pr-[340px] transition-all duration-300">
            <!-- 播放器区域 -->
            <div class="min-w-0 flex flex-col gap-3 lg:gap-4">
            <!-- 播放器容器 -->
            <div class="bg-black rounded-lg lg:rounded-2xl overflow-hidden shadow-xl relative group flex justify-center bg-black">
            <div class="w-full relative z-10 bg-black mx-auto transition-all duration-300" id="player-aspect" style="aspect-ratio: 16/9; max-height: 75vh;">
                <div id="player-container" class="absolute inset-0"></div>
                
                <!-- 加载状态 -->
                <div id="loader" class="absolute inset-0 z-40 bg-gray-900 flex flex-col items-center justify-center text-white">
                    <div class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p id="loader-msg" class="text-sm font-medium">正在解析视频源...</p>
                    <div class="mt-4 w-48 h-1 bg-gray-800 rounded-full overflow-hidden">
                        <div id="loader-bar" class="h-full bg-green-500 transition-all duration-500" style="width: 10%"></div>
                    </div>
                </div>
            </div>
            </div>
            
        </div>

            <!-- 简介卡片 -->
            <div class="bg-white dark:bg-gray-800 rounded-lg lg:rounded-xl p-4 lg:p-6 shadow-sm border border-gray-200 dark:border-gray-700 flex gap-4 lg:gap-6">
        <!-- 海报 - 较大尺寸 (移动端隐藏) -->
        <div class="hidden sm:block w-32 lg:w-36 flex-shrink-0">
            <div class="aspect-[2/3] rounded-lg overflow-hidden shadow-lg">
                <img id="detail-poster" data-src="" class="w-full h-full object-cover opacity-0 transition-opacity duration-300" alt="海报">
            </div>
        </div>

        <!-- 信息文本 -->
        <div class="flex-1 min-w-0 flex flex-col">
            <div class="flex items-start justify-between gap-2 lg:gap-4 mb-2 lg:mb-3">
                <h1 class="text-lg lg:text-3xl font-bold text-gray-900 dark:text-white line-clamp-2" id="detail-title">正在加载...</h1>
                <div class="flex items-center gap-1 lg:gap-2 flex-shrink-0">
                    <button onclick="shareVideo()" class="p-1.5 lg:p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700" title="分享">
                        <svg class="w-4 h-4 lg:w-5 lg:h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    </button>
                    <button id="favBtn" onclick="toggleFavorite()" class="p-1.5 lg:p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20" title="收藏">
                        <svg class="w-4 h-4 lg:w-5 lg:h-5 text-gray-400" id="fav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </button>
                </div>
            </div>
            <div class="flex flex-wrap gap-1.5 lg:gap-2 text-xs lg:text-sm text-gray-500 dark:text-gray-400 mb-2 lg:mb-3" id="detail-tags"></div>
            
            <p id="detail-desc" class="text-gray-600 dark:text-gray-300 text-xs lg:text-sm leading-relaxed line-clamp-2 lg:line-clamp-4">...</p>
        </div>
    </div>

        </div> <!-- End Left Content -->

    <!-- 右侧侧边栏：PC端固定定位，移动端流式布局 - 毛玻璃效果 -->
    <div id="right-sidebar" class="flex flex-col w-full lg:fixed lg:top-[65px] lg:right-0 lg:h-[calc(100vh-65px)] lg:w-[320px] bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl backdrop-saturate-150 border-t lg:border-t-0 lg:border-l border-gray-200/50 dark:border-gray-700/50 shadow-none lg:shadow-2xl z-40 lg:z-30 transition-transform duration-300 transform translate-x-0 mt-4 lg:mt-0">
        
        <!-- 侧边栏切换按钮 -->
        <button onclick="toggleRightSidebar()" id="sidebar-toggle-btn" title="点击隐藏/显示选集侧边栏"
                class="hidden lg:flex absolute left-[-32px] top-[80px] items-center justify-center w-8 h-12 bg-white dark:bg-gray-800 rounded-l-lg border-y border-l border-gray-200 dark:border-gray-700 shadow-[-4px_0_12px_rgba(0,0,0,0.05)] hover:text-green-500 transition-colors z-50">
            <svg id="sidebar-toggle-icon" class="w-4 h-4 text-gray-500 dark:text-gray-400 rotate-180 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>

        <div class="flex flex-col h-[500px] lg:h-full w-full relative" id="sidebar-card">
            <!-- 顶部 Tab -->
            <div class="flex gap-2 p-2 sm:p-3 bg-gray-50 dark:bg-gray-900/30 border-b border-gray-100 dark:border-gray-700">
                <button onclick="switchTab('episodes')" id="tab-btn-episodes" class="flex-1 py-2 sm:py-3 text-center text-sm font-bold rounded-lg sm:rounded-xl transition-all focus:outline-none bg-gradient-to-br from-green-400 to-green-500 text-white shadow-md shadow-green-200 dark:shadow-green-900/30">
                    选集
                </button>
                <button onclick="switchTab('sources')" id="tab-btn-sources" class="flex-1 py-2 sm:py-3 text-center text-sm font-medium rounded-lg sm:rounded-xl transition-all focus:outline-none bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">
                    换源
                </button>
            </div>

            <!-- Tab Content Wrapper -->
            <div class="flex-1 overflow-hidden relative min-h-[400px] bg-white dark:bg-gray-800">
                
                <!-- 选集视图 - 增强毛玻璃效果 -->
                <div id="view-episodes" class="absolute inset-0 flex flex-col bg-white/60 dark:bg-gray-900/40 backdrop-blur-md transition-all duration-300">
                    <!-- 分页/区间选择 (当集数较多时显示) - 更紧凑 -->
                    <div id="ep-ranges" class="flex gap-2 p-2 sm:p-3 overflow-x-auto hide-scrollbar flex-shrink-0 whitespace-nowrap bg-gray-50 dark:bg-gray-900/20 z-10 hidden border-b border-gray-100 dark:border-gray-700">
                        <!-- JS 生成 -->
                    </div>
                    
                    <!-- 列表头部: 信息与排序 - 更紧凑 -->
                    <div class="flex justify-between items-center px-3 sm:px-4 py-2 sm:py-2.5 flex-shrink-0 bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 z-10">
                        <span class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 font-medium" id="ep-status-text">更新至 ... 集</span>
                        <button onclick="toggleSort()" class="flex items-center gap-1 sm:gap-1.5 text-xs sm:text-sm text-gray-600 hover:text-green-600 transition-colors px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg hover:bg-white/60 dark:hover:bg-gray-800/40">
                            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>
                            <span id="sortText" class="font-medium">正序</span>
                        </button>
                    </div>

                    <!-- 剧集列表 - PC和移动端不同布局 -->
                    <div class="flex-1 px-3 sm:px-4 py-2 sm:py-3 overflow-y-auto custom-scrollbar-modern">
                        <div id="ep-list" class="grid grid-cols-5 sm:grid-cols-4 gap-2 sm:gap-3 pb-4 content-start">
                            <!-- JS 生成 -->
                        </div>
                    </div>
                </div>

                <!-- 换源视图 - 优化提示和列表样式 -->
                <div id="view-sources" class="absolute inset-0 flex flex-col bg-white dark:bg-gray-800 transition-all duration-300 opacity-0 pointer-events-none transform translate-x-full">
                    <div class="mx-4 mt-3 mb-2 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-xl text-xs text-blue-600 dark:text-blue-400 flex items-center gap-2 border border-blue-100 dark:border-blue-800/30">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>若播放卡顿或失败，请尝试切换线路</span>
                    </div>
                    <div class="px-4 pb-4 overflow-y-auto flex-1 custom-scrollbar-modern space-y-2.5" id="src-list">
                        <!-- JS 生成 -->
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <!-- 分享 Modal (海报样式) -->
    <div id="shareModal" class="fixed inset-0 z-[60] hidden flex flex-col items-center justify-center bg-black/90 backdrop-blur-sm p-6" onclick="$(this).addClass('hidden')">
        <div class="bg-white rounded-2xl overflow-hidden w-full max-w-[280px] shadow-2xl transform transition-all scale-100 relative" onclick="event.stopPropagation()">
            <!-- 海报区域：固定宽高比，防止过长 -->
            <div class="relative w-full aspect-[3/4] bg-gray-100 overflow-hidden">
                <img id="sharePoster" data-src="" class="w-full h-full object-cover opacity-0 transition-opacity duration-300" alt="Share Poster">
                <!-- 渐变遮罩 -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                <!-- 视频信息浮在海报底部 -->
                <div class="absolute bottom-0 left-0 right-0 p-4 text-white">
                    <h3 id="shareTitle" class="text-lg font-bold line-clamp-2 leading-tight mb-1 shadow-black/50 drop-shadow-md"></h3>
                    <div class="flex items-center gap-2 text-xs text-gray-300/90">
                        <span id="shareYear"></span>
                        <span class="w-px h-3 bg-white/30"></span>
                        <span>MoonTV 精选</span>
                    </div>
                </div>
                <div class="absolute top-3 right-3 bg-green-500/90 backdrop-blur-sm text-white text-[10px] px-2 py-0.5 rounded font-bold shadow-lg">高清播放</div>
            </div>
            
            <!-- 底部主要信息区域：紧凑布局 -->
            <div class="p-4 bg-white flex items-center justify-between gap-3">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5 mb-1">
                        <span class="w-6 h-6 rounded-full bg-green-500 flex items-center justify-center text-white text-xs font-bold">M</span>
                        <span class="font-bold text-gray-800 text-sm">MoonTV</span>
                    </div>
                    <p class="text-[10px] text-gray-400 leading-tight">扫描右侧二维码<br>免费观看完整版</p>
                    <div class="mt-2 text-[10px] text-green-600 font-bold bg-green-50 inline-block px-1.5 py-0.5 rounded">截图保存 分享好友</div>
                </div>
                <div class="bg-gray-50 p-1 rounded-lg border border-gray-100 flex-shrink-0">
                    <img id="shareQR" src="" class="w-16 h-16 rounded mb-0.5" alt="QR">
                    <div class="text-[8px] text-center text-gray-400 scale-90">微信/浏览器扫码</div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-6 mt-8">
            <button onclick="copyShareLink()" class="px-6 py-2.5 rounded-full bg-green-500 text-white text-sm font-bold shadow-lg shadow-green-500/30 active:scale-95 transition-transform flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                复制链接
            </button>
            <button onclick="$('#shareModal').addClass('hidden')" class="p-2.5 rounded-full bg-white/10 text-white hover:bg-white/20 backdrop-blur-md transition-all border border-white/20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>
    
    <!-- 移动端海报查看 Modal -->
    <div id="mobilePosterModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/95 p-4 backdrop-blur-xl" onclick="$(this).addClass('hidden')">
        <div class="relative w-full max-w-sm" onclick="event.stopPropagation()">
            <img id="mobilePosterImg" data-src="" class="w-full h-auto rounded-xl shadow-2xl object-contain bg-gray-900 border border-gray-800 opacity-0 transition-opacity duration-300" alt="Mobile Poster">
            <button onclick="$('#mobilePosterModal').addClass('hidden')" class="absolute -top-12 right-0 text-white/80 hover:text-white p-2" title="关闭海报">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <!-- 登录提示弹窗 -->
    <div id="login-prompt-modal" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all scale-100">
            <div class="p-6 text-center">
                <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">需要登录</h3>
                <p class="text-gray-600 dark:text-gray-300 mb-6">登录后即可收藏喜欢的影片，随时查看观看记录</p>
                
                <div class="flex flex-col gap-3">
                    <a href="/login" class="w-full py-3 bg-green-600 text-white font-bold rounded-xl shadow-lg hover:bg-green-700 transition-colors">立即登录</a>
                    <button onclick="$('#login-prompt-modal').addClass('hidden')" class="w-full py-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 text-sm">稍后再说</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 试看蒙层 (全屏弹窗) -->
    <div id="trial-modal" class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md hidden flex flex-col items-center justify-center text-center p-8">
        <div class="bg-gray-800 rounded-3xl p-10 max-w-sm border border-gray-700 shadow-2xl transform transition-all animate-fade-in mx-auto">
            <div class="w-16 h-16 bg-orange-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h3 class="text-2xl font-bold text-white mb-2">试看已结束</h3>
            <p class="text-gray-400 mb-8">开通 VIP 会员或使用兑换码解锁完整高清内容。</p>
            
            <div class="flex flex-col gap-3">
                <a href="/vip" class="w-full py-4 bg-gradient-to-r from-orange-500 to-red-600 text-white font-bold rounded-2xl shadow-lg hover:shadow-orange-500/40 transition-all text-lg font-sans">立即充值会员</a>
                <a href="/user" class="w-full py-3 bg-gray-700 text-gray-200 font-medium rounded-xl hover:bg-gray-600 transition-colors">使用卡密兑换</a>
                <button onclick="$('#trial-modal').addClass('hidden')" class="w-full py-2 text-gray-500 hover:text-gray-300 text-sm mt-2">暂不充值，返回</button>
            </div>
        </div>
    </div>
</div>

<style>
    .writing-vertical-rl { writing-mode: vertical-rl; }

    /* 移动端通用：缩小间距，防止控件挤压 */
    @media (max-width: 640px) {
        /* 控制栏底部内边距调整 */
        .art-video-player .art-bottom {
            padding: 0 4px !important;
        }
        /* 缩小间距 */
        .art-video-player .art-controls,
        .art-video-player .art-controls-left,
        .art-video-player .art-controls-right {
            gap: 0 !important; /* 移除 flex gap，改用更紧凑的控制 */
        }
        /* 缩小按钮尺寸和外边距 */
        .art-video-player .art-control {
            width: 32px !important; /* 默认通常是40-50px */
            height: 32px !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        /* 缩小图标尺寸 */
        .art-video-player .art-control .art-icon svg {
            width: 18px !important;
            height: 18px !important;
            transform: scale(0.9); /* 进一步视觉缩小 */
        }
        /* 时间文字缩小 */
        .art-video-player .art-control-time {
            font-size: 11px !important;
            padding: 0 4px !important;
            width: auto !important; /* 允许自适应宽度 */
        }
        
        /* 仅对进度条进行适度的触控优化，不改变布局结构 */
        .art-video-player .art-progress {
            height: 12px !important;
            display: flex !important;
            align-items: center !important;
        }
    }

    /* 修正 PC 端按钮隐藏过于激进的问题：仅针对移动端隐藏 */
    @media (max-width: 640px) {
        /* 左侧只保留播放（音量在竖屏可隐藏） */
        .art-video-player .art-control-volume {
            display: none !important;
        }

        /* 右侧只保留：设置 + 全屏 + 横屏(网页全屏/旋转按钮) + 倍速 */
        .art-video-player .art-controls-right {
            overflow: hidden;
        }
        .art-video-player .art-controls-right .art-control {
            display: none;
        }
        /* 移动端保留关键按钮 */
        .art-video-player .art-controls-right .art-control-setting,
        .art-video-player .art-controls-right .art-control-fullscreen,
        .art-video-player .art-controls-right .art-control-web-fullscreen,
        .art-video-player .art-controls-right .art-control-playbackrate,
        .art-video-player .art-controls-right .art-control-pip {
            display: inline-flex !important;
        }
    }

    /* 手机横屏：恢复更多控件（包含弹幕），并允许右侧横向滚动 */
    @media (max-width: 640px) and (orientation: landscape) {
        .art-video-player .art-controls-right {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .art-video-player .art-controls-right::-webkit-scrollbar {
            display: none;
        }
        .art-video-player input[placeholder*="弹幕"] {
            max-width: 44vw;
        }
    }

    /* 强制重置移动端侧边栏状态，防止 JS 的 PC 端逻辑影响移动端布局 */
    @media (max-width: 1023px) {
        #right-sidebar {
            transform: none !important;
            width: 100% !important;
            height: auto !important;
            position: static !important;
            margin-top: 0 !important; /* 移除顶部外边距，利用 left-content 的 padding */
            padding: 0 0.75rem; /* 添加水平内边距以与上方对齐 (p-3 = 0.75rem) */
        }
        /* 微调 left-content 的 padding，使视觉间距更均匀 */
        /* left-content 默认是 p-3 (0.75rem) */
    }
    
    /* 隐藏滚动条但保留功能 */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    

    /* 自定义滚动条 - 基础版 */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
    
    /* 现代化滚动条 - 更优雅 */
    .custom-scrollbar-modern::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar-modern::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.02);
        border-radius: 10px;
        margin: 4px 0;
    }
    .custom-scrollbar-modern::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #10b981 0%, #059669 100%);
        border-radius: 10px;
        transition: all 0.3s ease;
    }
    .custom-scrollbar-modern::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #059669 0%, #047857 100%);
        width: 8px;
    }
    .dark .custom-scrollbar-modern::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.03);
    }
    .dark .custom-scrollbar-modern::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #10b981 0%, #059669 100%);
    }
</style>
        
<script>
$(document).ready(function() {
    const id = '{$id}';
    const params = new URLSearchParams(window.location.search);
    window.v_nid = parseInt(params.get('nid')) || 0;
    const initialSource = params.get('source') || '';
    window.initialTitle = (params.get('title') || '').trim();
    
    window.art = null;
    window.curData = null;
    let cachedSources = [];
    let searchPromise = null; // 存储搜索任务的 Promise
    const TRIAL_SEC = 360;
    const SHORT_VIDEO_THRESHOLD = 360;  // 短视频阈值6分钟
    const SHORT_VIDEO_PERCENT = 0.4;    // 短视频试看40%
    let speeds = new Map();
    let isAsc = true;
    let allSources = []; // 存储所有播放源配置
    
    // 弹幕控制
    let lastDanmakuTime = 0;

    // ==================== 统一权限检查函数 ====================
    
    /**
     * 检查用户是否具有VIP权限（管理员也需要检查VIP有效期）
     * @returns {boolean} true=有VIP权限, false=无权限
     */
    function isVipValid() {
        if (!window.userInfo) {
            return false; // 未登录
        }
        
        // 检查VIP状态（兼容多种数据类型）
        const isVip = window.userInfo.is_vip == 1 ||
                      window.userInfo.is_vip === true ||
                      window.userInfo.is_vip === 'true';
        
        if (!isVip) {
            return false; // 非VIP
        }
        
        // 检查VIP是否过期（管理员也需要检查）
        if (window.userInfo.vip_expire_time) {
            const expireTime = new Date(window.userInfo.vip_expire_time).getTime();
            const now = Date.now();
            
            if (expireTime < now) {
                return false; // VIP已过期
            }
        }
        
        return true; // VIP有效
    }

    /**
     * 检查是否为管理员（仅用于UI显示，不影响权限判断）
     * @returns {boolean}
     */
    function isAdmin() {
        return window.userInfo && window.userInfo.role === 'admin';
    }

    /**
     * 统一的试看限制处理
     */
    function handleTrialRestriction() {
        if (!window.art || !window.art.duration) return;
        
        const duration = window.art.duration; // 视频总时长
        const currentTime = window.art.currentTime; // 当前播放进度
        
        let trialLimit; // 试看限制时间点
        
        // 判断：大于6分钟用固定时长，小于等于6分钟用百分比
        if (duration > SHORT_VIDEO_THRESHOLD) {
            // 长视频(>6分钟)：固定6分钟试看
            trialLimit = TRIAL_SEC;
        } else {
            // 短视频(≤6分钟)：按40%比例试看
            trialLimit = duration * SHORT_VIDEO_PERCENT;
        }
        
        // 调试日志
        console.log('试看检查:', {
            duration: duration,
            currentTime: currentTime,
            trialLimit: trialLimit,
            userInfo: window.userInfo,
            isVipValid: isVipValid()
        });
        
        // 检查是否超过试看限制
        if (currentTime > trialLimit) {
            console.log('触发试看限制!');
            window.art.pause();
            window.art.currentTime = trialLimit;
            
            // 根据视频类型显示不同提示
            if (duration <= SHORT_VIDEO_THRESHOLD) {
                const percent = Math.round(SHORT_VIDEO_PERCENT * 100);
                $('#trial-modal h3').text('试看已结束');
                $('#trial-modal p').text(`短视频试看${percent}%已结束，开通VIP会员观看完整内容`);
            } else {
                $('#trial-modal h3').text('试看已结束');
                $('#trial-modal p').text('开通 VIP 会员或使用兑换码解锁完整高清内容。');
            }
            
            $('#trial-modal').removeClass('hidden');
        }
    }

    // 分页配置
    const PAGE_SIZE = 50;
    let currentPageIdx = 0; // 当前选中的分页（0开始）

    /* --- Sidebar Logic (New Implementation) --- */
    
    // 初始化对齐：根据保存的状态设置初始样式
    function initRightSidebarState() {
        // 在播放页，我们希望右侧栏默认是显示的（与布局左侧栏不同），
        // 但是用户可能之前选择隐藏它。
        // 原逻辑是：moontv_sidebar_visible === 'false' 则隐藏。
        // 现在要根据用户反馈：点击播放时左侧边栏隐藏（已在layout处理），
        // 这里的 Right Sidebar 是播放列表，应该默认显示？
        // 反馈只提到了左侧边栏。右侧边栏（选集）通常是需要的。
        // 保持原样即可，或者默认展开。
        
        const isHidden = localStorage.getItem('moontv_sidebar_visible') === 'false';
        const sidebar = $('#right-sidebar');
        const leftContent = $('#left-content');
        const icon = $('#sidebar-toggle-icon');
        
        if (isHidden) {
            sidebar.addClass('translate-x-full');
            leftContent.removeClass('lg:pr-[340px]').addClass('lg:pr-0');
            icon.removeClass('rotate-180').addClass('rotate-0'); // 指向左，表示可以展开
        } else {
            // 默认展开
            sidebar.removeClass('translate-x-full');
            leftContent.removeClass('lg:pr-0').addClass('lg:pr-[340px]');
            icon.removeClass('rotate-0').addClass('rotate-180'); // 指向右，表示可以隐藏
        }
    }

    window.toggleRightSidebar = function() {
        const sidebar = $('#right-sidebar');
        const leftContent = $('#left-content');
        const icon = $('#sidebar-toggle-icon');
        const isHidden = sidebar.hasClass('translate-x-full'); // 当前是否隐藏

        if (isHidden) {
            // 展开操作
            sidebar.removeClass('translate-x-full');
            leftContent.removeClass('lg:pr-0').addClass('lg:pr-[340px]');
            icon.removeClass('rotate-0').addClass('rotate-180');
            localStorage.setItem('moontv_sidebar_visible', 'true');
        } else {
            // 隐藏操作
            sidebar.addClass('translate-x-full');
            leftContent.removeClass('lg:pr-[340px]').addClass('lg:pr-0');
            icon.removeClass('rotate-180').addClass('rotate-0');
            localStorage.setItem('moontv_sidebar_visible', 'false');
        }
        
        // 触发播放器 Resize
        setTimeout(() => { if(window.art && window.art.resize) window.art.resize(); }, 350);
    }

    // 初始化
    initRightSidebarState();

    /* --- Tab & UI Logic - 更现代的切换效果 --- */
    window.switchTab = function(tab) {
        if(tab === 'episodes') {
            $('#tab-btn-episodes').removeClass('bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300')
                .addClass('bg-gradient-to-br from-green-400 to-green-500 text-white shadow-md shadow-green-200 dark:shadow-green-900/30');
            $('#tab-btn-sources').removeClass('bg-gradient-to-br from-green-400 to-green-500 text-white shadow-md shadow-green-200 dark:shadow-green-900/30')
                .addClass('bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300');
            
            $('#view-episodes').removeClass('opacity-0 pointer-events-none transform -translate-x-full').addClass('opacity-100 z-10');
            $('#view-sources').addClass('opacity-0 pointer-events-none transform translate-x-full').removeClass('opacity-100 z-10');
        } else {
            $('#tab-btn-sources').removeClass('bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300')
                .addClass('bg-gradient-to-br from-green-400 to-green-500 text-white shadow-md shadow-green-200 dark:shadow-green-900/30');
            $('#tab-btn-episodes').removeClass('bg-gradient-to-br from-green-400 to-green-500 text-white shadow-md shadow-green-200 dark:shadow-green-900/30')
                .addClass('bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300');
            
            $('#view-sources').removeClass('opacity-0 pointer-events-none transform translate-x-full').addClass('opacity-100 z-10');
            $('#view-episodes').addClass('opacity-0 pointer-events-none transform -translate-x-full').removeClass('opacity-100 z-10');
        }
    }
    
    window.showMobilePoster = function() {
        if(window.curData) {
            $('#mobilePosterImg').attr('data-src', window.curData.poster).removeClass('opacity-0');
            window.MoonLazy.observe('#mobilePosterImg');
            $('#mobilePosterModal').removeClass('hidden');
        }
    }
    
    /* --- Core Logic --- */
    async function handleSendDanmaku(danmu) {
        // ... (保持原有逻辑) ...
        const now = Date.now();
        const cooldown = 2000;
        
        if (now - lastDanmakuTime < cooldown) {
            const waitTime = Math.ceil((cooldown - (now - lastDanmakuTime)) / 1000);
            window.art.notice.show = `请稍候 ${waitTime} 秒后再发送`;
            throw new Error('发送太快');
        }
        
        lastDanmakuTime = now;
        const videoTitle = window.curData.title || window.curData.vod_name || '';
        
        try {
            const token = localStorage.getItem('auth_token');
            const headers = {};
            if (token) headers.Authorization = 'Bearer ' + token;

            const res = await $.ajax({
                url: '/api/danmaku/send',
                method: 'POST',
                contentType: 'application/json',
                headers: headers,
                data: JSON.stringify({
                    title: videoTitle,
                    text: danmu.text,
                    time: danmu.time,
                    color: danmu.color, // 使用参数中的color
                    type: danmu.mode,   // 使用参数中的mode
                    nid: window.v_nid,
                    token: token
                })
            });
            
            if (res.code === 0) {
                window.art.notice.show = '弹幕发送成功';
                let displayText = danmu.text;
                if (window.userInfo) {
                    const username = window.userInfo.username || window.userInfo.user_id || 'User';
                    if (window.userInfo.role === 'admin') displayText = '👑' + username + ': ' + displayText;
                    else if (window.userInfo.is_vip) displayText = '💎' + username + ': ' + displayText;
                    else displayText = username + ': ' + displayText;
                }
                
                if (window.art.plugins.artplayerPluginDanmuku) {
                    window.art.plugins.artplayerPluginDanmuku.emit({
                        text: displayText, time: window.art.currentTime, mode: danmu.mode, color: danmu.color, border: false
                    });
                }
                return danmu;
            } else {
                window.art.notice.show = res.msg || '发送失败';
                throw new Error(res.msg);
            }
        } catch (error) {
            window.art.notice.show = error.message || '网络错误';
            throw error;
        }
    }

    function updateLoader(msg, progress) {
        if(msg) $('#loader-msg').text(msg);
        if(progress) $('#loader-bar').css('width', progress + '%');
    }

    // 动态注入 Header 内容 (返回键 + 标题)
    function injectHeaderContent(title) {
        // 清除移动端默认标题防止重叠
        if (window.innerWidth < 768) {
            $('.md\\:hidden.absolute').html(`<h1 class="text-base font-bold text-gray-900 line-clamp-1 max-w-[200px]">${title}</h1>`);
            $('#mobile-back-btn').removeClass('hidden');
        }

        // 桌面端注入逻辑
        if (window.innerWidth >= 768) {
            // 检查是否已经注入，避免重复
            if ($('#play-header-title').length) {
                $('#play-header-title').text(title);
                return;
            }

            const html = `
            <div id="play-header-left" class="flex items-center gap-4 mr-auto pl-2 animate-fade-in absolute left-[20px] md:static">
                <button onclick="history.back()" class="hidden md:block p-2 -ml-2 text-gray-600 hover:bg-gray-100 rounded-full transition-colors group" title="返回">
                    <svg class="w-5 h-5 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <h1 id="play-header-title" class="text-lg font-bold text-gray-800 dark:text-gray-200 line-clamp-1">${title}</h1>
            </div>`;
            
            // 清理中间区域并插入左侧内容
            $('#header-center').empty().addClass('hidden md:hidden'); // 彻底隐藏原来的 Search/Tabs
            
            // 插入到 Search Icon 之前（即 Header 的最左侧 Flex item 之后，或者直接作为第一个可见元素）
            // 在 layout.html 中，Desktop Header 结构是：
            // [MobileMenu] [Logo(Mobile)] [HeaderCenter] [RightIcons]
            // 我们要在 Desktop 模式下，替换 HeaderCenter 或在其左侧显示。
            // 简单做法：Prepend to Header container? No, flex order matters.
            // Insert before HeaderCenter if it exists, or prepend to header
            
            if ($('#play-header-left').length === 0) {
                 $('header > div.hidden.md\\:flex').before(html); // 插在 HeaderCenter 之前
            }
        }
    }

    async function init() {
        // 获取播放源配置
        try {
            const sourcesRes = await $.get('/api/config/sources');
            if (sourcesRes && sourcesRes.length) {
                allSources = sourcesRes;
                console.log('播放源配置加载成功:', allSources);
            }
        } catch (error) {
            console.warn('播放源配置加载失败:', error);
        }
        
        // 隐藏移动端 Header 上默认的 MoonTV Logo（防止重叠）
        if (window.innerWidth < 768) {
            $('.md\\:hidden.absolute a').hide();
        }

        // 初始注入 Header (使用 URL 标题)
        if (window.initialTitle) injectHeaderContent(window.initialTitle);

        updateLoader('连接资源库...', 30);
        
        // 如果提供了初始源且不是豆瓣，尝试直接获取详情
        if (initialSource && id && initialSource !== 'douban') {
            try {
                const res = await $.ajax({ url: '/api/detail', data: { id, source: initialSource }, timeout: 8000 });
                if (res.code === 200 && res.data && res.data.episodes && res.data.episodes.length > 0) {
                    // 获取播放源的中文名称
                    let sourceName = res.data.source_name || initialSource;
                    
                    // 如果source_name不存在或是简写，从全局配置中查找中文名
                    if (!res.data.source_name || (sourceName.length <= 5 && !/[\u4e00-\u9fa5]/.test(sourceName))) {
                        const sourceConfig = allSources.find(s => s.key === initialSource || s.key === (res.data.source || initialSource));
                        if (sourceConfig && sourceConfig.name) {
                            sourceName = sourceConfig.name;
                        }
                    }
                    
                    console.log('初始源信息:', {
                        source: res.data.source || initialSource,
                        source_name: sourceName,
                        from_config: allSources.find(s => s.key === initialSource)
                    });
                    
                    // 将初始源添加到 cachedSources，确保换源列表中显示
                    cachedSources = [{
                        id: res.data.id || id,
                        source: res.data.source || initialSource,
                        source_name: sourceName,
                        title: res.data.title || res.data.vod_name || window.initialTitle,
                        poster: res.data.poster || res.data.vod_pic || '',
                        remarks: res.data.vod_remarks || res.data.remarks || ''
                    }];
                    
                    renderPage(res.data);
                    renderSrcsUI(); // 立即渲染初始源到换源列表
                    searchPromise = performSearch(true); // 后台搜索其他源并保存 Promise
                    return;
                }
            } catch (e) {
                console.warn('默认源不可用或无播放链接:', e);
            }
        }
        
        // 如果直接获取失败或来源是豆瓣，进行搜索
        if (window.initialTitle) {
            await performSearch();
        } else {
            updateLoader('无法识别视频，请从首页重新选择', 0);
            $('#loader').html('<div class="p-8 text-center text-red-400 font-bold">无法加载视频<br/><a href="/" class="text-green-500 underline mt-4 inline-block">返回首页</a></div>');
        }
    }

    async function performSearch(isBg = false) {
        if(!isBg) updateLoader('正在全网为您搜索最快线路...', 50);
        try {
            const queryName = window.initialTitle.replace(/除三害/g, '').trim();
            const res = await $.ajax({ url: '/api/search', data: { q: queryName }, timeout: 20000 });
            if (res.code === 200 && res.data.length > 0) {
                // 合并新搜索到的源到 cachedSources，避免覆盖初始源(如果有)
                const newSources = res.data.filter(s => s.title.includes(queryName)).sort((a,b) => {
                    const matchA = a.title === queryName ? 0 : 1;
                    const matchB = b.title === queryName ? 0 : 1;
                    return matchA - matchB || a.title.length - b.title.length;
                });

                // 使用 Map 去重
                const sourceMap = new Map();
                // 先放入当前的 cachedSources
                cachedSources.forEach(s => sourceMap.set(s.source + '_' + s.id, s));
                // 再放入新搜索的 source (如果不存在)
                newSources.forEach(s => {
                    if (!sourceMap.has(s.source + '_' + s.id)) {
                        sourceMap.set(s.source + '_' + s.id, s);
                    }
                });
                
                cachedSources = Array.from(sourceMap.values());
                
                renderSrcsUI();
                testLatency(newSources); // 只测新源

                if (!window.curData && cachedSources.length > 0) {
                    // 尝试多个搜索结果，直到找到有播放源的
                    for (let i = 0; i < Math.min(cachedSources.length, 3); i++) {
                        try {
                            const detail = await $.get('/api/detail', { id: cachedSources[i].id, source: cachedSources[i].source });
                            if (detail.code === 200 && detail.data && detail.data.episodes && detail.data.episodes.length > 0) {
                                renderPage(detail.data);
                                break;
                            }
                        } catch (e) {
                            console.warn(`源 ${i} 获取失败:`, e);
                            continue;
                        }
                    }
                    
                    // 如果所有源都没有播放链接
                    if (!window.curData) {
                        $('#loader').html(`
                            <div class="p-8 text-center">
                                <div class="text-orange-400 font-bold mb-4">找到资源但暂无播放链接</div>
                                <p class="text-gray-400 text-sm mb-4">该视频可能暂未上线或资源站维护中</p>
                                <a href="/" class="inline-block px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">返回首页</a>
                            </div>
                        `);
                    }
                }
            } else if(!isBg) {
                $('#loader').html(`
                    <div class="p-8 text-center">
                        <div class="text-orange-400 font-bold mb-4">暂未搜到有效源</div>
                        <p class="text-gray-400 text-sm mb-4">请尝试搜索其他视频或稍后再试</p>
                        <a href="/" class="inline-block px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">返回首页</a>
                    </div>
                `);
            }
        } catch(e) { if(!isBg) updateLoader('搜索超时', 0); }
    }

    // 渲染延迟防抖定时器
    let renderLatencyTimer = null;
    
    function testLatency(list) {
        if (!list || list.length === 0) return;
        list.forEach(item => {
            const start = performance.now();
            fetch('/api/detail?id='+item.id+'&source='+item.source, { method: 'GET' })
                .then(res => {
                    if (res.ok) {
                        speeds.set(item.source + item.id, Math.round(performance.now() - start));
                        
                        // 防抖处理：避免每个源测速完成都重绘整个列表
                        if (renderLatencyTimer) clearTimeout(renderLatencyTimer);
                        renderLatencyTimer = setTimeout(() => {
                            renderSrcsUI();
                        }, 500); // 500ms 内只重绘一次
                    }
                }).catch(()=>{});
        });
    }

    function renderPage(data) {
        window.curData = data;
        
        // 检查是否有播放源
        if (!data.episodes || data.episodes.length === 0) {
            $('#loader').html(`
                <div class="p-8 text-center">
                    <div class="text-orange-400 font-bold mb-4">该资源暂无播放链接</div>
                    <p class="text-gray-400 text-sm mb-4">可能该视频暂未上线或资源站维护中</p>
                    <button onclick="performSearch()" class="inline-block px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 mb-2">重新搜索其他源</button>
                    <br/>
                    <a href="/" class="inline-block px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">返回首页</a>
                </div>
            `);
            return;
        }
        
        // 更新左侧详细信息
        const title = data.title || data.vod_name;
        $('#detail-title').text(title);
        injectHeaderContent(title); // 更新 Header 标题
        
        const posterUrl = data.poster || data.vod_pic || '/static/images/no-poster.jpg';
        $('#detail-poster').attr('data-src', posterUrl);
        window.MoonLazy.observe('#detail-poster');

        $('#detail-desc').text(data.desc || data.vod_content || '暂无简介');
        
        // 构造标签
        let tagsHtml = '';
        if(data.vod_year || data.year) tagsHtml += `<span class="bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-gray-600 dark:text-gray-300">${data.vod_year || data.year}</span>`;
        if(data.vod_area || data.area) tagsHtml += `<span class="bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-gray-600 dark:text-gray-300">${data.vod_area || data.area}</span>`;
        if(data.vod_class || data.class || data.type_name) tagsHtml += `<span class="bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-gray-600 dark:text-gray-300">${data.vod_class || data.class || data.type_name}</span>`;
        if(data.vod_lang || data.lang) tagsHtml += `<span class="bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-gray-600 dark:text-gray-300">${data.vod_lang || data.lang}</span>`;
        
        $('#detail-tags').html(tagsHtml);
        $('#detail-lang').text(data.vod_lang || data.lang || 'HD');
        
        // 更新当前播放源显示
        updateCurrentSourceDisplay();
        
        checkFav();
        
        // 计算当前集数所在的分页
        currentPageIdx = Math.floor(window.v_nid / PAGE_SIZE);
        renderEpisodePagination();

        updateLoader('连接成功', 100);
        setTimeout(() => {
            $('#loader').fadeOut(400);
            startArtPlayer(data.episodes[window.v_nid]);
            saveRec();
        }, 500);
    }
    
    // 渲染剧集分页器 (顶部 Range Tab) - 参考图二的设计
    function renderEpisodePagination() {
        if (!window.curData || !window.curData.episodes) return;
        
        const total = window.curData.episodes.length;
        $('#ep-status-text').text(`更新至 ${total} 集`);
        
        // 只有超过一页才显示分页器
        if (total > PAGE_SIZE) {
            let rangesHtml = '';

                        ${start}-${end}
                    </button>`;
            }

        }

    function renderEpisodes() {
        if (!window.curData || !window.curData.episodes) return;
        
        const episodes = window.curData.episodes;
        let displayList = [];
        
        // 确定需要渲染的范围
        let startIdx = 0;
        let endIdx = episodes.length;
        
        if (episodes.length > PAGE_SIZE) {
            startIdx = currentPageIdx * PAGE_SIZE;
            endIdx = Math.min((currentPageIdx + 1) * PAGE_SIZE, episodes.length);
        }
        
        // 构建当前页的数据
        for (let i = startIdx; i < endIdx; i++) {
            displayList.push({
                url: episodes[i],
                i: i,
                title: (window.curData.episodes_titles && window.curData.episodes_titles[i]) || `${i+1}`
            });
        }
        
        // 排序处理 (仅在当前页内排序，还是整剧反序？通常反序是最后一集在最前)
        // 简单实现：如果是倒序，那我们应该展示最后一页？
        // 修正：倒序通常意味着把整个列表反转。
        // 为了支持分页和倒序共存，通常是：
        // 正序：Page 0 is 1-50, Page 1 is 51-100.
        // 倒序：Page 0 is 100-51, Page 1 is 50-1.
        // 这里的实现简化为：保持分页索引不变，但在渲染列表时反转 displayList。
        // 即：Page 0 (Index 0) contains 1-50. If Sorted DESC, we show 50-1 inside Page 0? Or do we show Last Page as First Page?
        // MoonTV 之前的逻辑是简单的 array.reverse()。
        // 现在的逻辑：Sort Toggle 应该翻转整个列表的顺序展现。
        // 简单做法：如果不涉及分页，直接 sort。
        // 涉及分页时，通常"倒序"意味着最新的集数（最大的数字）排在最前面。
        // 所以 倒序时，Page 0 Should contain [Total... Total-50].
        // 让我们重新梳理一下 DisplayList 的生成。
        
        // 重新策略：生成完整的 Items 列表，然后 Slice。
        const allItems = episodes.map((url, i) => ({
            url: url,
            i: i,
            title: (window.curData.episodes_titles && window.curData.episodes_titles[i]) || (window.curData.episodes_titles ? window.curData.episodes_titles[i] : `${i+1}`) // 处理标题，如果全是数字则直接显示数字
        }));
        
        // 优化显示：如果不含 "第" 且 纯数字，则尝试让它看起来更简洁
        // 上面 title 逻辑保持原样即可
        
        if (!isAsc) {
            allItems.reverse();
        }
        
        // Slice based on Page
        // 注意：倒序后，分页的含义改变。Page 0 变成了 最后一批集数。
        // 我们需要重新生成 rangesHtml 吗？
        // 如果是倒序，Ranges 应该也是 100-51, 50-1 吗？
        // 鉴于时间，我们保持 Ranges 始终显示数字区间 (e.g. 1-50)，点击该 Range 显示该 Range 的内容。
        // “倒序”按钮只控制当前视图内的排序？ 还是全局？
        // 既然有分页，通常倒序是指把最新的放在最容易点击的地方。
        // 如果倒序：我们默认选中包含最新集数的那一页？或者 Ranges 也反转？
        
        // 简化方案：Toggle Sort 只反转 当前页内的显示顺序？ 不，这很奇怪。
        // 方案 B (推荐): Toggle Sort 切换整个列表的顺序。
        // 如果是倒序，Page 0 应该显示最新的集数 (e.g. 100-51)。
        
        // 让我们调整 renderEpisodePagination 逻辑支持倒序 Ranges 文本生成太复杂。
        // 回退方案：Sort 只在“非分页”模式下完全有效。
        // 在分页模式下，Sort 只反转当前页的显示顺序。这是腾讯视频等网站的常见做法。
        // 即：点击 1-50。正序显示 1...50。倒序显示 50...1。
        
        if (!isAsc) {
            displayList.reverse();
        }
        
        let html = '';
        displayList.forEach(item => {
            const active = item.i === window.v_nid;
            // 优化样式：参考图二的圆角方形按钮设计，移动端更紧凑
            const isLongTitle = item.title.length > 4;
            
            html += `<button onclick="switchEpisode(${item.i})"

                ${active ? 'bg-gradient-to-br from-green-400 to-green-500 text-white shadow-md shadow-green-200/60 dark:shadow-green-900/40 ring-1 ring-green-300 dark:ring-green-600' : 'bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-green-50 dark:hover:bg-gray-600 hover:shadow-sm border border-gray-200 dark:border-gray-600'}">
                <span class="text-xs sm:text-sm ${isLongTitle ? 'scale-90' : ''} truncate w-full px-1">${item.title}</span>
            </button>`;
        });
        $('#ep-list').html(html);
        $('#sortText').text(isAsc ? '正序' : '倒序');
    }

                    speedColor = 'text-green-600 dark:text-green-400';
                    speedBgColor = 'bg-green-50 dark:bg-green-900/30';
                } else if (ms < 400) {
                    speedBadge = '良好';
                    speedColor = 'text-blue-600 dark:text-blue-400';
                    speedBgColor = 'bg-blue-50 dark:bg-blue-900/30';
                } else if (ms < 600) {
                    speedBadge = '稳定';
                    speedColor = 'text-orange-600 dark:text-orange-400';
                    speedBgColor = 'bg-orange-50 dark:bg-orange-900/30';
                } else if (ms < 1000) {
                    speedBadge = '较慢';
                    speedColor = 'text-red-500 dark:text-red-400';
                    speedBgColor = 'bg-red-50 dark:bg-red-900/30';
                } else {
                    speedBadge = '极慢';
                    speedColor = 'text-gray-500 dark:text-gray-400';
                    speedBgColor = 'bg-gray-100 dark:bg-gray-800';
                }
            } else {
                speedBadge = '测速中';
                speedColor = 'text-gray-400';
                speedBgColor = 'bg-gray-50 dark:bg-gray-800';
            }
            html += `
            <div onclick="switchSource('${s.source}', '${s.id}')"
                 class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all duration-200 ${active ? 'bg-green-50/80 dark:bg-green-900/20 border-2 border-green-500 shadow-md' : 'bg-white dark:bg-gray-700 border border-gray-100 dark:border-gray-600 hover:border-green-300 dark:hover:border-green-500'}">
                <div class="w-10 h-14 rounded-lg overflow-hidden flex-shrink-0 bg-gray-100 dark:bg-gray-800">
                    <img data-src="${s.poster || '/static/images/no-poster.jpg'}" class="w-full h-full object-cover shadow-inner opacity-0 transition-opacity duration-300">
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2 mb-1">
                        <span class="text-sm font-bold truncate ${active ? 'text-green-700 dark:text-green-400' : 'text-gray-800 dark:text-gray-200'}">${s.source_name || s.source}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full font-bold ${speedBgColor} ${speedColor}">${speedBadge}</span>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs text-gray-400">${s.vod_remarks || s.remarks || '未知'}</span>
                        <div class="flex items-center gap-1.5">
                           ${ms ? `<span class="text-[10px] ${ms < 300 ? 'text-green-500' : ms < 500 ? 'text-orange-400' : 'text-red-400'} font-bold">${ms}ms</span>` : '<span class="text-[10px] text-gray-400 animate-pulse">测速中...</span>'}
                        </div>
                    </div>
                </div>
            </div>`;
        });
        $('#src-list').html(html);
        if(window.MoonLazy) window.MoonLazy.refresh();
    }

    window.switchSource = async function(src, sid, targetEpIdx = null) {
        updateLoader('正在切换线路...', 50);
        $('#loader').show().css('opacity', 1);
        try {
            const res = await $.get('/api/detail', { id: sid, source: src });
            if (res.code === 200) {
                // 如果只指定了切换源（用户手动点击），重置到第1集
                // 如果指定了 targetEpIdx（自动救急模式），尝试保持集数
                if (targetEpIdx !== null && res.data.episodes && res.data.episodes.length > targetEpIdx) {
                    window.v_nid = targetEpIdx;
                    console.log(`自动切换源成功，保持当前集数: 第${targetEpIdx+1}集`);
                } else {
                    window.v_nid = 0;
                }
                
                renderPage(res.data);
                
                // 更新当前播放源显示
                updateCurrentSourceDisplay();
                
                // 重新搜索该视频的所有播放源（慢加载），但不重置已有源
                updateLoader('正在搜索更多播放源...', 60);
                try {
                    const queryName = (res.data.title || res.data.vod_name || '').replace(/除三害/g, '').trim();
                    const searchRes = await $.ajax({ url: '/api/search', data: { q: queryName }, timeout: 15000 });
                    
                    if (searchRes.code === 200 && searchRes.data.length > 0) {
                        // 过滤和排序新搜索的源，使用更宽松的匹配逻辑
                        const newSources = searchRes.data.filter(s => {
                            // 更宽松的匹配：标题包含查询名，或者查询名包含标题
                            const title = (s.title || '').toLowerCase();
                            const query = queryName.toLowerCase();
                            return title.includes(query) || query.includes(title) || 
                                   s.source_name === queryName || s.source === queryName;
                        }).sort((a,b) => {
                            const matchA = a.title === queryName ? 0 : 1;
                            const matchB = b.title === queryName ? 0 : 1;
                            return matchA - matchB || a.title.length - b.title.length;
                        });
                        
                        // 合并已有源和新搜索的源，避免重复
                        const existingIds = new Set(cachedSources.map(s => s.source + s.id));
                        const uniqueNewSources = newSources.filter(s => !existingIds.has(s.source + s.id));
                        
                        // 更新缓存源列表（合并而不是替换）
                        cachedSources = [...cachedSources, ...uniqueNewSources];
                        
                        // 重新渲染换源UI
                        renderSrcsUI();
                        
                        // 只对新搜索的源进行测速（避免重复测速）
                        testLatency(uniqueNewSources);
                    }
                } catch (searchError) {
                    console.warn('搜索更多播放源失败:', searchError);
                    // 即使搜索失败，也要显示当前已有的源
                    renderSrcsUI();
                }
            }
        } catch(e) { updateLoader('线路异常', 0); }
    }

    function saveRec(isUnloading = false) {
        if (!window.curData) return;
        const rec = { sourceKey: window.curData.source, sourceId: window.curData.id, sid: 0, nid: window.v_nid, time: Date.now(), title: window.curData.title, poster: window.curData.poster };
        const local = JSON.parse(localStorage.getItem('moontv_play_history') || '{}');
        local[window.curData.id] = rec;
        localStorage.setItem('moontv_play_history', JSON.stringify(local));
        
        const token = localStorage.getItem('auth_token');
        if (!token) return;

        // 仅在页面卸载时，为了防止请求被取消，使用 sendBeacon
        if (isUnloading && navigator.sendBeacon) {
            // 使用 Blob 构造标准的 application/x-www-form-urlencoded 数据
            // 确保后端 PHP 能够像接收普通 $.post 一样接收数据
            const params = new URLSearchParams();
            params.append('source', window.curData.source);
            params.append('id', window.curData.id);
            params.append('token', token);
            
            for (const key in rec) {
                if (rec.hasOwnProperty(key)) {
                    params.append(`record[${key}]`, rec[key]);
                }
            }
            
            const blob = new Blob([params.toString()], {type: 'application/x-www-form-urlencoded'});
            navigator.sendBeacon('/api/playrecord', blob);
        } else {
            // 正常情况下，始终使用经过验证可靠的 jQuery post
            $.post('/api/playrecord', { source: window.curData.source, id: window.curData.id, record: rec, token: token });
        }
    }

    // 更新当前播放源显示
    function updateCurrentSourceDisplay() {
        if (!window.curData) return;
        
        // 从 cachedSources 中查找当前播放源的详细信息
        const currentSource = cachedSources.find(s => 
            s.source === window.curData.source && s.id == window.curData.id
        );
        
        // 调试：打印当前播放源信息
        console.log('当前播放源数据:', currentSource);
        
        // 获取播放源中文名，优先使用source_name，否则从全局配置中查找
        let sourceName = '未知播放源';
        if (currentSource) {
            sourceName = currentSource.source_name || currentSource.source || '未知播放源';
        } else {
            sourceName = window.curData.source || '未知播放源';
        }
        
        // 如果是英文简写，从全局配置中查找中文名
        if (sourceName.length <= 5 && !/[\u4e00-\u9fa5]/.test(sourceName)) {
            const sourceConfig = allSources.find(s => s.key === sourceName || s.name === sourceName);
            if (sourceConfig && sourceConfig.name) {
                sourceName = sourceConfig.name;
            }
        }
        
        // 获取现有标签内容，并移除之前的播放源标签
        const tagsContainer = $('#detail-tags');
        let existingTags = tagsContainer.html();
        
        // 移除之前的播放源标签（绿色背景的）
        existingTags = existingTags.replace(/<span[^>]*class="[^"]*bg-green-[^"]*"[^>]*>.*?<\/span>/g, '').trim();
        
        // 构建新的标签内容，播放源作为第一个标签（绿色突出）
        let newTagsHtml = `<span class="bg-green-100 dark:bg-green-900/30 px-2 py-1 rounded text-green-700 dark:text-green-300 font-medium">${sourceName}</span>`;
        
        // 添加现有标签
        if (existingTags) {
            newTagsHtml += existingTags;
        }
        
        // 更新标签容器
        tagsContainer.html(newTagsHtml);
    }

    function checkFav() {
        if (!window.userInfo || !window.curData) return;
        $.get('/api/favorite/check', { source: window.curData.source, id: window.curData.id }, (res) => {
            if (res.code === 200 && res.data.isFavorited) {
                $('#favBtn svg').addClass('text-red-500 fill-current').removeClass('text-gray-400');
            }
        });
    }

    window.toggleFavorite = function() {
        const token = localStorage.getItem('auth_token');
        if (!token) {
            $('#login-prompt-modal').removeClass('hidden');
            return;
        }
        const isF = $('#favBtn svg').hasClass('text-red-500'); // Check PC button state as source of truth
        const url = '/api/favorite';
        const favObj = { id: window.curData.id, source: window.curData.source, title: window.curData.title, poster: window.curData.poster, time: Date.now() };
        $.ajax({
            url: url, method: isF ? 'DELETE' : 'POST',
            data: { source: window.curData.source, id: window.curData.id, favorite: favObj, token: token },
            success: (res) => {
                if (res.code === 200) {
                    if(isF) {
                        $('#favBtn svg').removeClass('text-red-500 fill-current').addClass('text-gray-400').attr('fill', 'none');
                    } else {
                        $('#favBtn svg').addClass('text-red-500 fill-current').removeClass('text-gray-400').attr('fill', 'currentColor');
                    }
                } else if (res.code === 401) {
                    // 登录已过期，显示登录提示弹窗而不是强制跳转
                    $('#login-prompt-modal').removeClass('hidden');
                } else {
                    alert(res.msg || '操作失败');
                }
            },
            error: () => {
                alert('网络请求失败');
            }
        });
    }
    
    // 智能播放源自动切换函数（优化版）
    async function attemptAutoSwitch() {
        // 如果正在搜索中，等待搜索完成
        if (searchPromise) {
            console.log('正在执行后台搜索，等待搜索完成后再尝试切换...');
            window.art.notice.show = '🔎 正在搜索其他可用线路，请稍候...';
            try {
                await searchPromise;
                console.log('后台搜索已完成，继续执行切换逻辑');
                searchPromise = null; // 清除 Promise
            } catch (e) {
                console.warn('等待搜索失败:', e);
            }
        }

        // 检查切换次数限制
        if (switchAttemptCount >= MAX_SWITCH_ATTEMPTS) {
            console.log('已达到最大切换次数限制，停止自动切换');
            window.art.notice.show = '⚠ 所有播放源都无法播放，请稍后再试或联系管理员';
            return;
        }
        
        // 检查是否有其他播放源可切换
        if (!cachedSources || cachedSources.length <= 1) {
            console.log('只有1个可切换源，尝试重新搜索...');
             // 再次尝试搜索（防止之前的 searchPromise 已经由于某些原因结束但没结果）
             // 只有当真的没有 cachedSources 时才这样
             if (!cachedSources || cachedSources.length === 0) {
                 window.art.notice.show = '⚠ 暂无可用播放源';
             } else {
                 console.log('当前源即为唯一源，无法切换');
                 window.art.notice.show = '⚠ 当前暂无其他线路可切换';
             }
            return;
        }
        
        // 记录当前失败的播放源
        if (window.curData) {
            const currentKey = `${window.curData.source}_${window.curData.id}`;
            failedSources.add(currentKey);
            console.log('添加失败播放源:', currentKey);
        }
        
        // 过滤并排序可用的播放源
        const availableSources = cachedSources
            .filter(s => {
                // 排除当前正在播放的源
                if (window.curData && s.source === window.curData.source && s.id == window.curData.id) {
                    return false;
                }
                
                // 排除已经尝试失败的源
                const sourceKey = `${s.source}_${s.id}`;
                if (failedSources.has(sourceKey)) {
                    return false;
                }
                
                return true;
            })
            .map(s => {
                const ms = speeds.get(s.source + s.id);
                return { ...s, latency: ms || 9999 };
            })
            .sort((a, b) => {
                // 优先选择有延迟数据的（说明测速成功）
                if (a.latency < 9999 && b.latency >= 9999) return -1;
                if (a.latency >= 9999 && b.latency < 9999) return 1;
                // 都有延迟数据，按延迟排序
                return a.latency - b.latency;
            });
        
        if (availableSources.length === 0) {
            console.log('没有其他可用播放源');
            window.art.notice.show = '⚠ 暂无其他可用播放源，请稍后再试';
            return;
        }
        
        // 选择最佳播放源
        const bestSource = availableSources[0];
        const sourceName = bestSource.source_name || bestSource.source || '备用线路';
        const latencyInfo = bestSource.latency < 9999 ? ` (${bestSource.latency}ms)` : '';
        
        switchAttemptCount++;
        
        // 显示友好的切换提示
        const attemptInfo = switchAttemptCount > 1 ? ` (尝试${switchAttemptCount}/${MAX_SWITCH_ATTEMPTS})` : '';
        window.art.notice.show = `🔄 正在为您切换到更快的播放源${attemptInfo}...`;
        
        console.log('自动切换到播放源:', {
            attempt: switchAttemptCount,
            source: bestSource.source,
            source_name: sourceName,
            latency: bestSource.latency,
            id: bestSource.id,
            availableCount: availableSources.length
        });
        
        // 重置状态以便新播放源也能触发检测
        autoSwitchAttempted = false;
        hasStartedPlaying = false;
        
        // 延迟1秒后执行切换
        setTimeout(async () => {
            try {
                // 传入当前集数索引，尝试保持播放进度
                const currentEpIdx = window.v_nid || 0;
                await switchSource(bestSource.source, bestSource.id, currentEpIdx);
                
                // 切换成功后显示详细信息
                const finalMessage = `✓ 已切换到：${sourceName}${latencyInfo}`;
                setTimeout(() => {
                    if (window.art) window.art.notice.show = finalMessage;
                }, 800);
            } catch (error) {
                console.error('自动切换播放源失败:', error);
                if (window.art) {
                    window.art.notice.show = '⚠ 切换失败，继续尝试其他线路...';
                }
            }
        }, 1000);
    }

    // 移动端不再需要手动控制弹幕或发送弹幕，相关函数已清理
    
    // 资源清理：页面卸载前销毁播放器和定时器，防止返回时卡顿
    window.addEventListener('beforeunload', function() {
        // 离开页面前使用 Beacon 尝试保存记录
        saveRec(true);
        
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        if (renderLatencyTimer) {
            clearTimeout(renderLatencyTimer);
            renderLatencyTimer = null;
        }

        // 轻量销毁：仅停止 HLS 下载流，释放网络连接，但不销毁 DOM（避免 UI 阻塞）
        if (window.art && window.art.hls) {
            try {
                window.art.hls.stopLoad();
                window.art.hls.destroy();
                window.art.hls = null;
            } catch (e) {
                console.warn('HLS销毁异常:', e);
            }
        }
    });

    init();
});
</script>
