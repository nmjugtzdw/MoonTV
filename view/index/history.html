{extend name="layout" /}

{block name="content"}
<div class="space-y-6">
    <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 relative">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2">
                <button onclick="history.back()" class="md:hidden p-1 -ml-1 text-gray-500 hover:bg-gray-100 rounded-full" title="返回">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h1 class="text-xl md:text-2xl font-bold text-gray-900">观看记录</h1>
            </div>
            <button onclick="clearPlayHistory()" class="px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-full transition-colors border border-transparent hover:border-red-100">
                清空记录
            </button>
        </div>
        
        <!-- 历史记录列表 -->
        <div id="historyList" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-3 sm:gap-4">
            <!-- 动态加载 -->
        </div>
        
        <!-- 空状态 -->
        <div id="emptyHistory" class="text-center py-20 hidden">
            <svg class="w-20 h-20 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-gray-400 text-lg">暂无观看记录</p>
            <a href="/" class="inline-block mt-4 px-6 py-2 bg-green-600 text-white rounded-full hover:bg-green-700 transition-colors">去看看</a>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        loadPlayHistory();
    });

    function loadPlayHistory() {
        if (window.userInfo) {
            const token = localStorage.getItem('auth_token') || getCookie('auth_token');
            $.ajax({
                url: '/api/playrecord',
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function(res) {
                    if (res.code === 200) {
                        renderHistoryData(res.data);
                    }
                }
            });
        } else {
            const PLAY_HISTORY_KEY = 'moontv_play_history';
            const historyData = JSON.parse(localStorage.getItem(PLAY_HISTORY_KEY) || '{}');
            renderHistoryData(historyData);
        }
    }

    function renderHistoryData(historyData) {
        const items = [];
        const seenIds = new Set();

        Object.values(historyData).forEach(item => {
            if (typeof item === 'string') {
                try { item = JSON.parse(item); } catch(e) {}
            }
            if (item && item.sourceId && !seenIds.has(item.sourceId)) {
                seenIds.add(item.sourceId);
                items.push(item);
            }
        });

        items.sort((a, b) => b.time - a.time);

        if (items.length > 0) {
            renderHistoryList(items);
            $('#emptyHistory').hide();
        } else {
            $('#historyList').empty();
            $('#emptyHistory').removeClass('hidden');
        }
    }

    function renderHistoryList(items) {
        let html = '';
        items.forEach(item => {
            const title = item.posterTitle || item.title || '未知影片';
            const poster = item.poster || '';
            const episodeText = `第${(item.nid || 0) + 1}集`;
            const playUrl = `/play/${item.sourceId}?source=${item.sourceKey}&sid=${item.sid || 0}&nid=${item.nid || 0}&title=${encodeURIComponent(title)}`;
            
            const date = new Date(item.time);
            const timeStr = `${date.getMonth()+1}-${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;

            html += `
                <div class="relative group">
                    <a href="${playUrl}" class="block">
                        <div class="relative w-full aspect-[3/4] rounded-lg overflow-hidden bg-gray-200 shadow-sm mb-2">
                            <img data-src="${poster}" alt="${title}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105 opacity-0 transition-opacity duration-300"
                                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgZmlsbD0iI2YzZjRZjYiIvPjwvc3ZnPg=='" loading="lazy">
                            
                            <!-- 移动端右上角进度标签 -->
                            <div class="absolute top-1 right-1 bg-black/60 backdrop-blur-sm text-white text-[10px] px-1.5 py-0.5 rounded-md">
                                ${episodeText}
                            </div>
                            
                            <!-- 播放蒙层 -->
                            <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <div class="w-8 h-8 rounded-full bg-white/90 flex items-center justify-center shadow-lg">
                                    <svg class="w-4 h-4 text-green-600 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </div>
                            </div>
                        </div>
                        
                        <h3 class="text-xs sm:text-sm font-medium text-gray-800 line-clamp-1 mb-0.5">${title}</h3>
                        <p class="text-[10px] sm:text-xs text-gray-400 scale-95 origin-left truncate">${timeStr.split(' ')[0]}</p>
                    </a>
                    
                    <!-- 删除按钮 (移动端右上角常驻，更易操作) -->
                    <button onclick="event.preventDefault(); deleteHistoryItem('${item.sourceId}', '${item.sourceKey}')"
                            class="absolute top-1 left-1 sm:-top-1.5 sm:-left-1.5 w-6 h-6 bg-black/50 sm:bg-red-500 text-white rounded-full flex items-center justify-center shadow-md backdrop-blur-sm sm:backdrop-blur-none sm:transform sm:scale-0 sm:group-hover:scale-100 transition-all z-10 hover:bg-red-600">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            `;
        });
        $('#historyList').html(html);
        if(window.MoonLazy) window.MoonLazy.refresh();
    }

    window.clearPlayHistory = function() {
        if (confirm('确定要清空所有观看记录吗？')) {
            // 云端暂不支持一键清空 API? UserData.php 里 deletePlayRecord 只删单个。
            // 暂时只清空本地。如果需要清空云端，需增加 API 或循环删除（不推荐）。
            // 检查后端代码，如果没有清空参数，无法清空。
            // 目前只能清空本地。
            localStorage.removeItem('moontv_play_history');
            loadPlayHistory();
        }
    };

    window.deleteHistoryItem = function(sourceId, sourceKey) { // 增加 sourceKey 参数以便调用 API
        if (window.userInfo) {
            const token = localStorage.getItem('auth_token') || getCookie('auth_token');
            $.ajax({
                url: '/api/playrecord',
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token },
                data: { source: sourceKey, id: sourceId },
                success: function() {
                    loadPlayHistory();
                }
            });
        }

        const PLAY_HISTORY_KEY = 'moontv_play_history';
        const historyData = JSON.parse(localStorage.getItem(PLAY_HISTORY_KEY) || '{}');
        
        Object.keys(historyData).forEach(key => {
            if (historyData[key] && historyData[key].sourceId == sourceId) {
                delete historyData[key];
            }
        });
        
        localStorage.setItem(PLAY_HISTORY_KEY, JSON.stringify(historyData));
        if (!window.userInfo) loadPlayHistory();
    };
</script>
{/block}
