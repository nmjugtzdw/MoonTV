<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$title|default='MoonTV - 在线影视'}</title>
    <link rel="icon" href="/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#10b981' } } } }
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer@5.3.0/dist/artplayer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer-plugin-danmuku@5.1.1/dist/artplayer-plugin-danmuku.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/static/js/lazyload.js?v=2.0"></script>
    <style>
        :root { --p: #10b981; --bg: #f9fafb; --txt: #1f2937; }
        .dark { --bg: #1a1a1a; --txt: #e5e5e5; }
        body { background-color: var(--bg); color: var(--txt); font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .sidebar-link { display: flex; align-items: center; padding: 12px 20px; color: #6b7280; font-size: 14px; transition: background-color 0.2s ease, color 0.2s ease; }
        .sidebar-link:hover { background-color: rgba(249, 250, 251, 0.5); color: var(--p); }
        .sidebar-link { border-radius: 12px; margin: 0 10px; }
        .sidebar-link.active { background-color: rgba(209, 250, 229, 0.6); color: #047857; font-weight: 700; }
        .sidebar-link.active svg { color: #047857; }
        .dark .sidebar-link:hover { background-color: rgba(255, 255, 255, 0.05); }
        .dark .sidebar-link.active { background-color: rgba(16, 185, 129, 0.15); color: #34d399; }
        .dark .sidebar-link.active svg { color: #34d399; }
        /* 文字淡入淡出效果 */
        .sidebar-label {
            opacity: 1;
            transition: opacity 0.2s ease, width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            white-space: nowrap;
        }
        .sidebar-label.hidden {
            opacity: 0;
            width: 0 !important;
        }
        /* 折叠状态样式 - 图标保持左侧位置不变 */
        #sidebar.md\:w-20 .sidebar-link { padding: 12px 0; justify-content: center; }
        #sidebar.md\:w-20 .sidebar-link.active { background-color: #d1fae5; }
        #sidebar.md\:w-20 .sidebar-link svg { margin-right: 0 !important; width: 20px !important; height: 20px !important; flex-shrink: 0; }
        /* 平滑过渡 */
        #sidebar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #main-content { transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 45; }
        .overlay.active { display: block; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        /* 隐藏滚动条通用样式 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex min-h-screen">
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <!-- 侧边栏 - 毛玻璃效果 -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white/70 dark:bg-gray-900/70 backdrop-blur-xl backdrop-saturate-150 border-r border-gray-200/50 dark:border-gray-700/50 transform -translate-x-full transition-all duration-300 md:translate-x-0 md:fixed md:inset-auto md:h-screen md:top-0 md:w-52 overflow-y-auto flex flex-col shadow-xl">
        <div class="p-6 pt-4 whitespace-nowrap">
            <div class="flex items-center justify-between mb-6 px-1">
                <a href="/" class="flex items-center gap-2 sidebar-label">
                    <h1 class="text-2xl font-bold text-green-500">MoonTV</h1>
                </a>
                <button onclick="toggleSidebar()" class="p-1 text-gray-500 hover:bg-gray-100 rounded-lg" title="切换菜单">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
        <nav class="space-y-1 flex-1 overflow-y-auto px-2 pb-4">
            <a href="/" class="sidebar-link" data-nav="index"><svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg><span class="sidebar-label">首页</span></a>
            <a href="/search" class="sidebar-link" data-nav="search"><svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg><span class="sidebar-label">搜索</span></a>
            <a href="/list/movie" class="sidebar-link" data-nav="movie"><svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg><span class="sidebar-label">电影</span></a>
            <a href="/list/tv" class="sidebar-link" data-nav="tv"><svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg><span class="sidebar-label">剧集</span></a>
            <a href="/list/variety" class="sidebar-link" data-nav="variety"><svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span class="sidebar-label">综艺</span></a>
            <a href="/list/anime" class="sidebar-link" data-nav="anime"><svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg><span class="sidebar-label">动漫</span></a>
            <a href="/list/shorts" class="sidebar-link" data-nav="shorts"><svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg><span class="sidebar-label">短剧</span></a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 w-full overflow-x-hidden pb-16 md:pb-0 md:ml-52 bg-gradient-to-br from-[#f0f9ff] to-[#f8fafc] dark:from-gray-900 dark:to-gray-800" id="main-content">
        <!-- Header：固定顶部，初始透明，滚动后显示毛玻璃效果 -->
        <header id="main-header" class="fixed top-0 left-0 right-0 z-40 px-4 py-2 flex items-center justify-between transition-all duration-300 h-[56px] md:h-auto md:left-52" style="margin-left: 0;">
            <div class="flex items-center md:hidden">
                <a href="/search" class="p-2 text-gray-600 hover:bg-black/5 dark:text-gray-300 dark:hover:bg-white/10 rounded-full transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></a>
                <button id="mobile-back-btn" class="hidden p-2 text-gray-600 hover:bg-black/5 dark:text-gray-300 dark:hover:bg-white/10 rounded-full ml-1" onclick="history.back()"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg></button>
            </div>
            
            <div class="md:hidden absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
                <a href="/" class="text-xl font-black text-[#10b981] tracking-wide">MoonTV</a>
            </div>

            <!-- 桌面端头部中间区域 (Tab占位) -->
            <div class="hidden md:flex items-center justify-center flex-1" id="header-center"></div>

            <div class="flex items-center gap-1 md:gap-4">
                <!-- 桌面端仅显示搜索图标 -->
                <a href="/search" class="hidden md:block p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors order-none" title="搜索">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </a>
                <button onclick="toggleDarkMode()" class="p-2 text-gray-500 hover:bg-black/5 dark:text-gray-400 dark:hover:bg-white/10 rounded-full transition-colors order-1 md:order-none"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="theme-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg></button>
                
                <div id="guest-box" class="order-2 md:order-none ml-1">
                    <a href="/login" class="flex items-center justify-center w-9 h-9 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-full hover:bg-green-200 dark:hover:bg-green-800/40 transition-all transform hover:scale-110 active:scale-95 shadow-sm" title="登录">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </a>
                </div>
                
                <div id="user-box" class="hidden relative order-2 md:order-none ml-1">
                    <button onclick="toggleUserMenu()" class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-all">
                        <div id="user-avatar" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-green-600 text-white flex items-center justify-center font-bold text-sm shadow-inner"></div>
                    </button>
                    <!-- User Menu Dropdown - 优化版毛玻璃效果 -->
                    <div id="user-menu" class="hidden absolute right-0 mt-2 w-56 bg-white/80 dark:bg-gray-800/80 backdrop-blur-xl backdrop-saturate-150 rounded-xl shadow-xl border border-gray-100/50 dark:border-gray-700/50 overflow-hidden z-50 animate-fade-in origin-top-right">
                        <!-- VIP 信息卡片 (优化紧凑布局) -->
                        <div class="bg-gradient-to-br from-amber-50 via-orange-50 to-amber-50 dark:from-amber-900/20 dark:via-orange-900/20 dark:to-amber-900/20 p-4 border-b border-amber-100 dark:border-amber-800/30">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-2 flex-1 min-w-0">
                                    <span class="text-xl flex-shrink-0" id="role-icon">⭐</span>
                                    <span class="text-sm font-bold text-gray-800 dark:text-gray-200 truncate" id="vip-status">普通用户</span>
                                </div>
                            </div>
                            <div class="text-xs text-gray-600 dark:text-gray-400 mb-3" id="vip-expire">开通VIP，畅享高清影视</div>
                            <a href="/vip" id="vip-recharge-btn" class="block w-full text-center bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white text-xs font-bold py-2 rounded-lg transition-all shadow-sm">
                                充值会员
                            </a>
                        </div>
                        
                        <!-- 菜单选项 - 优化紧凑布局 -->
                        <div class="py-1">
                            <a href="/user" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors group">
                                <svg class="w-4 h-4 text-gray-400 group-hover:text-green-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                <span class="flex-1">个人中心</span>
                            </a>
                            <a href="/history" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors group">
                                <svg class="w-4 h-4 text-gray-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span class="flex-1">播放记录</span>
                            </a>
                            <a href="/?type=favorites" onclick="window.location.href='/?type=favorites'; return false;" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors group">
                                <svg class="w-4 h-4 text-gray-400 group-hover:text-red-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                <span class="flex-1">我的收藏</span>
                            </a>
                            <a href="/orders" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors group">
                                <svg class="w-4 h-4 text-gray-400 group-hover:text-purple-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                                <span class="flex-1">我的订单</span>
                            </a>
                        </div>
                        
                        <hr class="border-gray-100 dark:border-gray-700">
                        <button onclick="logout()" class="flex items-center gap-3 w-full text-left px-4 py-2.5 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors group">
                            <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            <span class="flex-1">退出登录</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>
        <main class="flex-1 p-4 md:p-6 lg:p-8 w-full mx-auto mt-[56px] md:mt-0" style="max-width: 1600px;">
            {block name="content"}{/block}
        </main>
    </div>

    <!-- 底部导航 (移动端) -->
    <!-- 底部导航 (移动端) - 加强毛玻璃效果 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/75 dark:bg-gray-900/75 backdrop-blur-xl backdrop-saturate-150 border-t border-gray-100/50 dark:border-gray-800/50 md:hidden z-50 flex justify-around items-center h-[56px] pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <a href="/" class="flex flex-col items-center justify-center w-full h-full text-gray-600 dark:text-gray-400 hover:text-green-500 transition-colors" data-path="/">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] font-medium leading-none">首页</span>
        </a>
        <a href="/list/movie" class="flex flex-col items-center justify-center w-full h-full text-gray-600 dark:text-gray-400 hover:text-green-500 transition-colors" data-path="/list/movie">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <span class="text-[10px] font-medium leading-none">电影</span>
        </a>
        <a href="/list/tv" class="flex flex-col items-center justify-center w-full h-full text-gray-600 dark:text-gray-400 hover:text-green-500 transition-colors" data-path="/list/tv">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            <span class="text-[10px] font-medium leading-none">剧集</span>
        </a>
        <a href="/list/shorts" class="flex flex-col items-center justify-center w-full h-full text-gray-600 dark:text-gray-400 hover:text-green-500 transition-colors" data-path="/list/shorts">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
            <span class="text-[10px] font-medium leading-none">短剧</span>
        </a>
        <a href="/user" onclick="handleMobileUserClick(event)" class="flex flex-col items-center justify-center w-full h-full text-gray-600 dark:text-gray-400 hover:text-green-500 transition-colors" data-path="/user">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] font-medium leading-none">我的</span>
        </a>
    </div>

    <!-- 免责声明弹窗 -->
    <div id="welcomeModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in">
        <div class="bg-white rounded-2xl shadow-2xl w-[85vw] max-w-[300px] overflow-hidden transform transition-all scale-100">
            <div class="p-5">
                <h3 class="text-xl font-bold text-gray-900 mb-4">提示</h3>
                <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded-r-lg mb-6">
                    <p id="welcome-announcement-text" class="text-sm text-gray-600 leading-relaxed">加载中...</p>
                </div>
                <button onclick="closeWelcomeModal()" class="w-full py-3 bg-green-600 text-white font-bold rounded-xl shadow-lg">我知道了</button>
            </div>
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div id="passwordModal" class="fixed inset-0 z-[70] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all scale-100 relative">
            <button onclick="closePasswordModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="p-6">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6 text-center">修改密码</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">旧密码</label>
                        <input type="password" id="oldPassword" class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 text-sm transition-all" placeholder="请输入当前密码">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">新密码</label>
                        <input type="password" id="newPassword" class="w-full px-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 text-sm transition-all" placeholder="请输入新密码 (至少6位)">
                    </div>
                    <button onclick="submitPasswordChange()" class="w-full py-2.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-md transition-all mt-2">确认修改</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sb = $('#sidebar');
            const mc = $('#main-content');
            if (window.innerWidth < 768) {
                sb.hasClass('-translate-x-full') ? sb.removeClass('-translate-x-full').addClass('translate-x-0 shadow-xl') : sb.removeClass('translate-x-0 shadow-xl').addClass('-translate-x-full');
                $('#overlay').toggleClass('active');
            } else {
                if (sb.hasClass('md:w-52')) {
                    sb.removeClass('md:w-52').addClass('md:w-20');
                    mc.removeClass('md:ml-52').addClass('md:ml-20');
                    $('.sidebar-label').addClass('hidden');
                    localStorage.setItem('sc', '1');
                } else {
                    sb.removeClass('md:w-20').addClass('md:w-52');
                    mc.removeClass('md:ml-20').addClass('md:ml-52');
                    $('.sidebar-label').removeClass('hidden');
                    localStorage.setItem('sc', '0');
                }
            }
        }
        $(document).ready(() => {
            const isPlayPage = window.location.pathname.startsWith('/play/');
            
            // 播放页：强制收起 (仅桌面端)
            if (isPlayPage && window.innerWidth >= 768) {
                $('#sidebar').removeClass('md:w-52').addClass('md:w-20');
                $('#main-content').removeClass('md:ml-52').addClass('md:ml-20');
                $('.sidebar-label').addClass('hidden');
            }
            // 非播放页：恢复用户之前的选择
            else if (localStorage.getItem('sc') === '1' && window.innerWidth >= 768) {
                $('#sidebar').removeClass('md:w-52').addClass('md:w-20');
                $('#main-content').removeClass('md:ml-52').addClass('md:ml-20');
                $('.sidebar-label').addClass('hidden');
            }
            
            checkLogin(); loadAnnouncement(); showWelcomeModal();
            // 在搜索页面隐藏顶部搜索框，但保持占位
            if (window.location.pathname === '/search') {
                // 搜索页额外逻辑
            }

            // 移除自动隐藏逻辑，保持默认 Sticky 布局
            
            // 自动高亮当前导航
            const path = window.location.pathname;
            let activeNav = 'index';
            if (path.includes('/list/movie')) activeNav = 'movie';
            else if (path.includes('/list/tv')) activeNav = 'tv';
            else if (path.includes('/list/variety')) activeNav = 'variety';
            else if (path.includes('/list/anime')) activeNav = 'anime';
            else if (path.includes('/list/shorts')) activeNav = 'shorts';
            else if (path.includes('/search')) activeNav = 'search';
            else if (path === '/') activeNav = 'index';
            
            $(`.sidebar-link[data-nav="${activeNav}"]`).addClass('active');
            
            // 移动端底部导航高亮
            $(`a[data-path]`).each(function() {
                const p = $(this).data('path');
                if ((p === '/' && path === '/') || (p !== '/' && path.startsWith(p))) {
                    $(this).removeClass('text-gray-600 dark:text-gray-400').addClass('text-green-600');
                    // 激活态使用稍粗的线条
                    $(this).find('svg').attr('stroke-width', '2');
                    $(this).find('span').removeClass('font-medium').addClass('font-bold');
                }
            });
            
            window.handleMobileUserClick = function(e) {
                if(!localStorage.getItem('auth_token')) {
                    e.preventDefault();
                    window.location.href = '/login';
                }
            };
            
            // 滚动时添加毛玻璃效果
            const header = document.getElementById('main-header');
            
            function updateHeaderStyle() {
                const scrollY = window.scrollY || window.pageYOffset;
                
                if (scrollY > 10) {
                    // 滚动时：显示毛玻璃效果
                    header.classList.add('bg-white/70', 'dark:bg-gray-900/70', 'backdrop-blur-xl', 'backdrop-saturate-150', 'shadow-[0_4px_6px_-1px_rgba(0,0,0,0.02)]', 'border-b', 'border-white/5');
                } else {
                    // 顶部：透明无背景
                    header.classList.remove('bg-white/70', 'dark:bg-gray-900/70', 'backdrop-blur-xl', 'backdrop-saturate-150', 'shadow-[0_4px_6px_-1px_rgba(0,0,0,0.02)]', 'border-b', 'border-white/5');
                }
            }
            
            // 监听滚动事件
            window.addEventListener('scroll', updateHeaderStyle, { passive: true });
            
            // 初始化检查
            updateHeaderStyle();
            
            // 响应侧边栏折叠时调整 Header 左边距
            const sidebar = document.getElementById('sidebar');
            const observer = new MutationObserver(() => {
                if (window.innerWidth >= 768) {
                    if (sidebar.classList.contains('md:w-20')) {
                        header.style.marginLeft = '0';
                        header.classList.remove('md:left-52');
                        header.classList.add('md:left-20');
                    } else {
                        header.style.marginLeft = '0';
                        header.classList.remove('md:left-20');
                        header.classList.add('md:left-52');
                    }
                } else {
                    header.style.marginLeft = '0';
                    header.classList.remove('md:left-52', 'md:left-20');
                }
            });
            observer.observe(sidebar, { attributes: true, attributeFilter: ['class'] });
        });
        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light'; }
        if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
        function checkLogin() {
            const t = localStorage.getItem('auth_token');
            if(t) $.ajax({
                url:'/api/user/info',
                headers:{'Authorization':'Bearer '+t},
                success:r=>{
                    if(r.code===200){
                        window.userInfo = r.data; // 全局存储用户信息，供播放器判断会员/管理权限
                        $('#guest-box').addClass('hidden');
                        $('#user-box').removeClass('hidden');
                        const username = r.data.username || 'User';
                        const role = r.data.role || '';
                        const vipExpireTime = r.data.vip_expire_time || '';
                        
                        // 使用用户名首字母作为头像
                        const initial = username.charAt(0).toUpperCase();
                        $('#user-avatar').text(initial);
                        
                        // 统一处理：管理员和VIP都检查VIP有效期，不再单独显示管理员身份
                        // 管理员也需要维护VIP状态
                        const isVip = r.data.is_vip == 1 || r.data.is_vip === true || r.data.is_vip === 'true';
                        
                        if(isVip && vipExpireTime) {
                            const expireDate = new Date(vipExpireTime);
                            const now = new Date();
                            if(expireDate > now) {
                                const days = Math.ceil((expireDate - now) / (1000 * 60 * 60 * 24));
                                $('#role-icon').html('👑');
                                $('#vip-status').text(username);
                                $('#vip-expire').text('有效期：' + days + ' 天');
                                $('#vip-recharge-btn').hide();
                                // 统一使用主题绿色背景
                                $('#user-avatar').removeClass('bg-green-100 dark:bg-green-900/30').addClass('bg-gradient-to-br from-green-500 to-green-600 text-white');
                            } else {
                                // VIP已过期
                                $('#role-icon').html('⚠️');
                                $('#vip-status').text(username);
                                $('#vip-expire').text('VIP已过期，请续费').addClass('text-red-500');
                                $('#vip-recharge-btn').show();
                                $('#user-avatar').removeClass('bg-green-100 dark:bg-green-900/30').addClass('bg-gradient-to-br from-green-500 to-green-600 text-white');
                            }
                        } else {
                            // 非VIP用户（包括非VIP的管理员）
                            $('#role-icon').html('⭐');
                            $('#vip-status').text(username);
                            $('#vip-expire').text('开通VIP，畅享高清影视');
                            $('#vip-recharge-btn').show();
                            $('#user-avatar').removeClass('bg-green-100 dark:bg-green-900/30').addClass('bg-gradient-to-br from-green-500 to-green-600 text-white');
                        }
                    }
                }
            });
        }
        function showWelcomeModal() { if(location.pathname!=='/')return; if(!localStorage.getItem('d_read')) { $.get('/api/config/get?name=SiteConfig', r=>{ if(r.code===200) $('#welcome-announcement-text').text(r.data.Announcement||'欢迎使用MoonTV'); $('#welcomeModal').removeClass('hidden'); }); } }
        function closeWelcomeModal() { localStorage.setItem('d_read', '1'); $('#welcomeModal').addClass('hidden'); }
        function loadAnnouncement() {}
        function toggleUserMenu() { $('#user-menu').toggleClass('hidden'); }
        function logout() {
            localStorage.removeItem('auth_token');
            // 清除 Cookie
            document.cookie = 'auth_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            // 跳转到登录页面
            window.location.href = '/login';
        }
        // 点击外部关闭用户菜单
        $(document).click(function(e) { if (!$(e.target).closest('#user-box').length) { $('#user-menu').addClass('hidden'); } });

        // 密码修改逻辑
        function openPasswordModal() { $('#passwordModal').removeClass('hidden'); }
        function closePasswordModal() { $('#passwordModal').addClass('hidden'); $('#oldPassword').val(''); $('#newPassword').val(''); }
        
        function submitPasswordChange() {
            const oldPwd = $('#oldPassword').val();
            const newPwd = $('#newPassword').val();
            if (!oldPwd || !newPwd) { alert('请填写完整信息'); return; }
            if (newPwd.length < 6) { alert('新密码不能少于6位'); return; }
            
            const token = localStorage.getItem('auth_token');
            if(!token) return;

            const btn = $('button[onclick="submitPasswordChange()"]');
            const originalText = btn.text();
            btn.prop('disabled', true).text('提交中...');

            $.ajax({
                url: '/api/user/password',
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                data: { old_password: oldPwd, new_password: newPwd },
                success: function(res) {
                    if (res.code === 200) {
                        alert('密码修改成功，请重新登录');
                        logout();
                    } else {
                        alert(res.msg || '修改失败');
                    }
                },
                error: function() { alert('网络错误'); },
                complete: function() {
                    btn.prop('disabled', false).text(originalText);
                }
            });
        }
    </script>
</body>
</html>
