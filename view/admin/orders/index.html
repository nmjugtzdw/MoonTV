{extend name="admin/layout" /}

{block name="content"}
<div class="bg-white rounded-lg shadow-lg">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-xl font-bold text-gray-800">订单管理</h3>
        <div class="flex gap-2">
            <select id="statusFilter" class="border rounded px-3 py-1.5 text-sm" onchange="loadOrders(1)">
                <option value="">所有状态</option>
                <option value="1">支付成功</option>
                <option value="0">待支付</option>
            </select>
            <input type="text" id="keyword" placeholder="订单号/用户名" class="border rounded px-3 py-1.5 text-sm">
            <button onclick="loadOrders(1)" class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm hover:bg-blue-700">搜索</button>
        </div>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-200">
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">订单号</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">用户</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">套餐</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">金额</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">支付方式</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">状态</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">创建时间</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">支付时间</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="orderList">
                <tr><td colspan="9" class="px-6 py-8 text-center text-gray-500">加载中...</td></tr>
            </tbody>
        </table>
        
        <!-- 分页 -->
        <div class="mt-4 flex justify-between px-6 py-4" id="pagination"></div>
    </div>
</div>

<script>
    let currentPage = 1;

    $(document).ready(function() {
        loadOrders(1);
    });

    function loadOrders(page) {
        currentPage = page;
        const status = $('#statusFilter').val();
        const keyword = $('#keyword').val();

        $.ajax({
            url: '/api/admin/orders',
            data: { page, status, keyword },
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            success: function(res) {
                if (res.code === 200) {
                    renderTable(res.data.data);
                    renderPagination(res.data);
                } else {
                    alert(res.msg || '加载失败');
                }
            }
        });
    }

    function renderTable(list) {
        let html = '';
        if (list.length === 0) {
            html = '<tr><td colspan="9" class="px-6 py-8 text-center text-gray-500">暂无数据</td></tr>';
        } else {
            list.forEach(item => {
                const statusClass = item.status == 1 ? 'bg-green-100 text-green-800' : 'bg-orange-100 text-orange-800';
                const statusText = item.status == 1 ? '成功' : '待支付';
                
                html += `
                    <tr>
                        <td class="px-6 py-4 text-gray-500 text-sm">#${item.id}</td>
                        <td class="px-6 py-4 font-mono text-sm text-gray-900">${item.order_no}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${item.username}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${item.package_name}</td>
                        <td class="px-6 py-4 text-sm font-bold text-gray-800">¥${item.amount}</td>
                        <td class="px-6 py-4 text-sm text-gray-500 uppercase">${item.pay_type}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">
                                ${statusText}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">${formatTime(item.created_at || item.create_time)}</td>
                        <td class="px-6 py-4 text-sm text-gray-500">${item.notify_time || '-'}</td>
                    </tr>
                `;
            });
        }
        $('#orderList').html(html);
    }

    function renderPagination(data) {
        if (data.last_page <= 1) {
            $('#pagination').html('');
            return;
        }
        
        let html = `
            <button onclick="loadOrders(${data.current_page - 1})" ${data.current_page === 1 ? 'disabled' : ''} class="px-4 py-2 border rounded ${data.current_page===1?'text-gray-400':'hover:bg-gray-50'}">上一页</button>
            <span>第 ${data.current_page} 页 / 共 ${data.last_page} 页</span>
            <button onclick="loadOrders(${data.current_page + 1})" ${data.current_page === data.last_page ? 'disabled' : ''} class="px-4 py-2 border rounded ${data.current_page===data.last_page?'text-gray-400':'hover:bg-gray-50'}">下一页</button>
        `;
        $('#pagination').html(html);
    }

    function formatTime(time) {
        if (!time) return '-';
        if (/^\d+$/.test(time)) {
             const date = new Date(parseInt(time) * 1000);
             return date.getFullYear() + '-' +
                 String(date.getMonth() + 1).padStart(2, '0') + '-' +
                 String(date.getDate()).padStart(2, '0') + ' ' +
                 String(date.getHours()).padStart(2, '0') + ':' +
                 String(date.getMinutes()).padStart(2, '0') + ':' +
                 String(date.getSeconds()).padStart(2, '0');
        }
        return time;
    }
</script>
{/block}
