{extend name="admin/layout" /}

{block name="content"}
<div class="flex justify-between items-center mb-6">
    <h3 class="text-2xl font-bold text-gray-800">VIP 套餐管理</h3>
    <button onclick="openModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
        + 新增套餐
    </button>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full text-left">
        <thead>
            <tr class="bg-gray-50 border-b">
                <th class="px-6 py-4 font-bold text-gray-600">ID</th>
                <th class="px-6 py-4 font-bold text-gray-600">套餐名称</th>
                <th class="px-6 py-4 font-bold text-gray-600">天数</th>
                <th class="px-6 py-4 font-bold text-gray-600">价格</th>
                <th class="px-6 py-4 font-bold text-gray-600">原价</th>
                <th class="px-6 py-4 font-bold text-gray-600">操作</th>
            </tr>
        </thead>
        <tbody id="vipList" class="divide-y divide-gray-100">
            <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">加载中...</td></tr>
        </tbody>
    </table>
</div>

<!-- 编辑/新增模态框 -->
<div id="vipModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
        <h3 class="text-xl font-bold mb-4" id="modalTitle">新增套餐</h3>
        <input type="hidden" id="pkgId">
        
        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">套餐名称</label>
                <input type="text" id="pkgName" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例如：月卡">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">天数</label>
                    <input type="number" id="pkgDays" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="30">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">价格 (元)</label>
                    <input type="number" step="0.01" id="pkgPrice" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="9.9">
                </div>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">原价 (选填)</label>
                <input type="number" step="0.01" id="pkgOriginal" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="19.9">
            </div>
        </div>
        
        <div class="flex gap-3 mt-6">
            <button onclick="closeModal()" class="flex-1 py-2 border rounded-lg text-gray-600 hover:bg-gray-50">取消</button>
            <button onclick="savePackage()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">保存</button>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        loadPackages();
    });

    function loadPackages() {
        $.ajax({
            url: '/api/admin/vip/packages',
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            success: function(res) {
                if (res.code === 200) {
                    renderList(res.data);
                }
            }
        });
    }

    function renderList(list) {
        let html = '';
        if (list.length === 0) {
            html = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">暂无数据</td></tr>';
        } else {
            list.forEach(item => {
                html += `
                    <tr>
                        <td class="px-6 py-4 text-gray-500">#${item.id}</td>
                        <td class="px-6 py-4 font-medium text-gray-900">${item.name}</td>
                        <td class="px-6 py-4 text-gray-600">${item.days} 天</td>
                        <td class="px-6 py-4 text-orange-600 font-bold">¥${item.price}</td>
                        <td class="px-6 py-4 text-gray-400 line-through">¥${item.original_price || '-'}</td>
                        <td class="px-6 py-4">
                            <button onclick='editPackage(${JSON.stringify(item)})' class="text-blue-600 hover:text-blue-800 mr-3">编辑</button>
                            <button onclick="deletePackage(${item.id})" class="text-red-600 hover:text-red-800">删除</button>
                        </td>
                    </tr>
                `;
            });
        }
        $('#vipList').html(html);
    }

    function openModal() {
        $('#modalTitle').text('新增套餐');
        $('#pkgId').val('');
        $('#pkgName').val('');
        $('#pkgDays').val('');
        $('#pkgPrice').val('');
        $('#pkgOriginal').val('');
        $('#vipModal').removeClass('hidden').addClass('flex');
    }

    function editPackage(item) {
        $('#modalTitle').text('编辑套餐');
        $('#pkgId').val(item.id);
        $('#pkgName').val(item.name);
        $('#pkgDays').val(item.days);
        $('#pkgPrice').val(item.price);
        $('#pkgOriginal').val(item.original_price);
        $('#vipModal').removeClass('hidden').addClass('flex');
    }

    function closeModal() {
        $('#vipModal').addClass('hidden').removeClass('flex');
    }

    function savePackage() {
        const data = {
            id: $('#pkgId').val(),
            name: $('#pkgName').val(),
            days: $('#pkgDays').val(),
            price: $('#pkgPrice').val(),
            original_price: $('#pkgOriginal').val()
        };

        if(!data.name || !data.days || !data.price) {
            alert('请填写完整信息');
            return;
        }

        $.ajax({
            url: '/api/admin/vip/package/save',
            method: 'POST',
            contentType: 'application/json',
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            data: JSON.stringify(data),
            success: function(res) {
                if (res.code === 200) {
                    alert('保存成功');
                    closeModal();
                    loadPackages();
                } else {
                    alert(res.msg || '保存失败');
                }
            }
        });
    }

    function deletePackage(id) {
        if (!confirm('确定要删除这个套餐吗？')) return;

        $.ajax({
            url: '/api/admin/vip/package/delete',
            method: 'POST',
            contentType: 'application/json',
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            data: JSON.stringify({id: id}),
            success: function(res) {
                if (res.code === 200) {
                    loadPackages();
                } else {
                    alert(res.msg || '删除失败');
                }
            }
        });
    }
</script>
{/block}
