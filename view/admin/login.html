<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonTV 后台登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-gray-900">
    <div class="flex items-center justify-center min-h-screen">
        <div class="px-8 py-6 mt-4 text-left bg-white shadow-lg rounded-xl w-full max-w-sm">
            <h3 class="text-2xl font-bold text-center text-gray-900">后台管理系统</h3>
            <div class="mt-4">
                <div>
                    <label class="block text-gray-700" for="username">用户名</label>
                    <input type="text" placeholder="Admin Username" id="username"
                        class="w-full px-4 py-2 mt-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-blue-600">
                </div>
                <div class="mt-4">
                    <label class="block text-gray-700" for="password">密码</label>
                    <input type="password" placeholder="Password" id="password"
                        class="w-full px-4 py-2 mt-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-blue-600">
                </div>
                <div class="flex items-baseline justify-between">
                    <button id="loginBtn" onclick="doLogin()" class="px-6 py-2 mt-6 text-white bg-blue-600 rounded-lg hover:bg-blue-900 w-full transition-colors">登录</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function doLogin() {
            const username = $('#username').val();
            const password = $('#password').val();
            const btn = $('#loginBtn');

            if (!username || !password) {
                alert('请输入完整信息');
                return;
            }

            btn.prop('disabled', true).text('登录中...');

            $.ajax({
                url: '/api/admin/login',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username, password }),
                success: function(res) {
                    if (res.code === 200) {
                        localStorage.setItem('admin_token', res.data.token);
                        document.cookie = `admin_token=${res.data.token}; path=/`;
                        window.location.href = '/admin';
                    } else {
                        alert(res.msg || '登录失败');
                        btn.prop('disabled', false).text('登录');
                    }
                },
                error: function(xhr) {
                    console.error(xhr);
                    alert('网络错误: ' + xhr.status);
                    btn.prop('disabled', false).text('登录');
                }
            });
        }
        
        // Enter key support
        $(document).on('keypress', function(e) {
            if(e.which == 13) {
                doLogin();
            }
        });
    </script>
</body>
</html>
