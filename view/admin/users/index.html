{extend name="admin/layout" /}

{block name="content"}
<div class="bg-white rounded-lg shadow-lg">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-bold text-gray-800">用户管理</h3>
        <div class="flex gap-2">
            <input type="text" placeholder="搜索用户名/UID" class="border rounded px-3 py-1.5 text-sm">
            <button class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm hover:bg-blue-700">搜索</button>
        </div>
    </div>
    
    <div class="overflow-x-auto p-4">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-200">
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">用户名</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">VIP状态</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">过期时间</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">积分</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">注册时间</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">状态</th>
                    <th class="px-6 py-3 text-xs font-semibold text-gray-600 uppercase tracking-wider">操作</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="userList">
                <!-- 列表内容 -->
                <tr>
                    <td colspan="8" class="px-6 py-8 text-center text-gray-500">加载中...</td>
                </tr>
            </tbody>
        </table>
        
        <!-- 分页 -->
        <div class="mt-4 flex items-center justify-between px-4 py-3 bg-white border-t border-gray-200 sm:px-6" id="pagination">
            <!-- 分页内容 -->
        </div>
    </div>
</div>

<script>
    let currentPage = 1;
    let currentKeyword = '';

    $(document).ready(function() {
        loadUsers(1);

        $('button:contains("搜索")').click(function() {
            currentKeyword = $('input[placeholder="搜索用户名/UID"]').val();
            loadUsers(1);
        });
    });

    function loadUsers(page) {
        currentPage = page;
        $.ajax({
            url: '/api/admin/users',
            data: { page: page, keyword: currentKeyword },
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            success: function(res) {
                if (res.code === 200) {
                    renderTable(res.data.data);
                    renderPagination(res.data);
                } else {
                    alert(res.msg || '加载失败');
                }
            }
        });
    }

    function renderTable(users) {
        let html = '';
        if (users.length === 0) {
            html = '<tr><td colspan="8" class="px-6 py-8 text-center text-gray-500">暂无数据</td></tr>';
        } else {
            users.forEach(u => {
                html += `
                    <tr>
                        <td class="px-6 py-4 text-sm text-gray-500">#${u.id}</td>
                        <td class="px-6 py-4 text-sm font-medium text-gray-900 flex items-center gap-2">
                            ${u.username}
                            ${u.role === 'admin' ? '<span class="px-1.5 py-0.5 bg-red-100 text-red-600 text-xs rounded">管理</span>' : ''}
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">
                            ${u.is_vip ? '<span class="text-orange-500 font-bold">VIP</span>' : '<span class="text-gray-400">普通</span>'}
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">${u.vip_expire_time ? u.vip_expire_time.split(' ')[0] : '-'}</td>
                        <td class="px-6 py-4 text-sm text-gray-500">${u.points || 0}</td>
                        <td class="px-6 py-4 text-sm text-gray-500">${u.create_time || u.created_at}</td>
                        <td class="px-6 py-4 text-sm text-gray-500">
                            ${u.banned ? '<span class="text-red-500">封禁</span>' : '<span class="text-green-500">正常</span>'}
                        </td>
                        <td class="px-6 py-4 text-sm font-medium">
                            ${u.banned
                                ? `<button onclick="updateUserStatus(${u.id}, 'unban')" class="text-green-600 hover:text-green-900 mr-3">解封</button>`
                                : `<button onclick="updateUserStatus(${u.id}, 'ban')" class="text-orange-600 hover:text-orange-900 mr-3">封禁</button>`
                            }
                            <button onclick="updateUserStatus(${u.id}, 'delete')" class="text-red-600 hover:text-red-900">删除</button>
                        </td>
                    </tr>
                `;
            });
        }
        $('#userList').html(html);
    }

    function updateUserStatus(id, action) {
        let msg = '确定要执行此操作吗？';
        if(action === 'ban') msg = '确定要封禁该用户吗？';
        if(action === 'unban') msg = '确定要解封该用户吗？';
        if(action === 'delete') msg = '警告：删除用户不可恢复！确定要删除吗？';

        if (!confirm(msg)) return;

        $.ajax({
            url: '/api/admin/users/update_stats',
            method: 'POST',
            contentType: 'application/json',
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            data: JSON.stringify({ id, action }),
            success: function(res) {
                if (res.code === 200) {
                    alert('操作成功');
                    loadUsers(currentPage);
                } else {
                    alert(res.msg || '操作失败');
                }
            }
        });
    }

    function renderPagination(data) {
        if (data.last_page <= 1) {
            $('#pagination').html('');
            return;
        }
        
        let html = `
            <div class="flex flex-1 justify-between sm:hidden">
                <button onclick="loadUsers(${data.current_page - 1})" ${data.current_page === 1 ? 'disabled' : ''} class="relative inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">上一页</button>
                <button onclick="loadUsers(${data.current_page + 1})" ${data.current_page === data.last_page ? 'disabled' : ''} class="relative ml-3 inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">下一页</button>
            </div>
            <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                <div>
                    <p class="text-sm text-gray-700">
                        显示第 <span class="font-medium">${(data.current_page - 1) * 10 + 1}</span> 到 <span class="font-medium">${Math.min(data.current_page * 10, data.total)}</span> 条，共 <span class="font-medium">${data.total}</span> 条
                    </p>
                </div>
                <div>
                    <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                        <button onclick="loadUsers(${data.current_page - 1})" ${data.current_page === 1 ? 'disabled' : ''} class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <span class="sr-only">Previous</span>
                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" /></svg>
                        </button>
                        <!-- 简单处理：只显示当前页 -->
                        <span class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-blue-50 text-sm font-medium text-blue-600">${data.current_page}</span>
                        <button onclick="loadUsers(${data.current_page + 1})" ${data.current_page === data.last_page ? 'disabled' : ''} class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <span class="sr-only">Next</span>
                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" /></svg>
                        </button>
                    </nav>
                </div>
            </div>
        `;
        $('#pagination').html(html);
    }
</script>
{/block}
