{extend name="admin/layout" /}

{block name="content"}
<!-- 统计卡片 -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
    <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-gray-500 text-sm font-medium mb-1">总弹幕数</p>
                <p class="text-2xl font-bold text-gray-800" id="totalDanmaku">--</p>
            </div>
            <div class="p-3 bg-blue-100 rounded-full">
                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </div>
        </div>
    </div>
    
    <div class="bg-white rounded-lg shadow p-6 border-l-4 border-green-500">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-gray-500 text-sm font-medium mb-1">今日弹幕</p>
                <p class="text-2xl font-bold text-gray-800" id="todayDanmaku">--</p>
            </div>
            <div class="p-3 bg-green-100 rounded-full">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
        </div>
    </div>
    
    <div class="bg-white rounded-lg shadow p-6 border-l-4 border-purple-500">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-gray-500 text-sm font-medium mb-1">正常显示</p>
                <p class="text-2xl font-bold text-gray-800" id="activeDanmaku">--</p>
            </div>
            <div class="p-3 bg-purple-100 rounded-full">
                <svg class="w-8 h-8 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
        </div>
    </div>
    
    <div class="bg-white rounded-lg shadow p-6 border-l-4 border-red-500">
        <div class="flex items-center justify-between">
            <div>
                <p class="text-gray-500 text-sm font-medium mb-1">已屏蔽</p>
                <p class="text-2xl font-bold text-gray-800" id="blockedDanmaku">--</p>
            </div>
            <div class="p-3 bg-red-100 rounded-full">
                <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
            </div>
        </div>
    </div>
</div>

<!-- 搜索和筛选 -->
<div class="bg-white rounded-lg shadow p-6 mb-6">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <input type="text" id="searchVideoName" placeholder="搜索视频名称" class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="searchKeyword" placeholder="搜索弹幕内容或IP" class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="filterStatus" class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">全部状态</option>
            <option value="1">正常显示</option>
            <option value="0">已屏蔽</option>
        </select>
        <button onclick="loadDanmakuList()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            搜索
        </button>
    </div>
</div>

<!-- 弹幕列表 -->
<div class="bg-white rounded-lg shadow overflow-hidden">
    <div class="px-6 py-4 bg-gray-50 border-b flex justify-between items-center">
        <h3 class="text-lg font-medium text-gray-900">弹幕列表</h3>
        <div class="flex gap-2">
            <button onclick="batchDelete()" class="px-4 py-2 bg-red-500 text-white text-sm rounded-lg hover:bg-red-600 transition">
                批量删除
            </button>
        </div>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead class="bg-gray-50 border-b">
                <tr>
                    <th class="px-4 py-3 text-left">
                        <input type="checkbox" id="checkAll" onclick="toggleCheckAll()" class="rounded">
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">ID</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">用户</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">视频名称</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">弹幕内容</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">颜色</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">时间点</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">IP</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">发送时间</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">状态</th>
                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">操作</th>
                </tr>
            </thead>
            <tbody id="danmakuTableBody" class="divide-y divide-gray-200">
                <tr><td colspan="11" class="px-6 py-8 text-center text-gray-500">加载中...</td></tr>
            </tbody>
        </table>
    </div>
    
    <!-- 分页 -->
    <div class="px-6 py-4 bg-gray-50 border-t flex justify-between items-center">
        <div class="text-sm text-gray-600">
            共 <span id="totalCount">0</span> 条记录
        </div>
        <div class="flex gap-2" id="pagination">
            <!-- 分页按钮动态生成 -->
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let selectedIds = new Set();

$(document).ready(function() {
    loadStats();
    loadDanmakuList();
});

// 加载统计数据
function loadStats() {
    $.ajax({
        url: '/api/admin/danmaku/stats',
        headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
        success: function(res) {
            if (res.code === 200) {
                $('#totalDanmaku').text(res.data.total);
                $('#todayDanmaku').text(res.data.today_count);
                $('#activeDanmaku').text(res.data.active_count);
                $('#blockedDanmaku').text(res.data.blocked_count);
            }
        }
    });
}

// 加载弹幕列表
function loadDanmakuList(page = 1) {
    currentPage = page;
    const videoName = $('#searchVideoName').val();
    const keyword = $('#searchKeyword').val();
    const status = $('#filterStatus').val();
    
    $.ajax({
        url: '/api/admin/danmaku/list',
        headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
        data: {
            page: page,
            limit: 20,
            video_name: videoName,
            keyword: keyword,
            status: status
        },
        success: function(res) {
            if (res.code === 200) {
                renderDanmakuList(res.data.data);
                renderPagination(res.data.current_page, res.data.last_page);
                $('#totalCount').text(res.data.total);
            }
        }
    });
}

// 渲染弹幕列表
function renderDanmakuList(list) {
    if (list.length === 0) {
        $('#danmakuTableBody').html('<tr><td colspan="11" class="px-6 py-8 text-center text-gray-500">暂无数据</td></tr>');
        return;
    }
    
    let html = '';
    list.forEach(item => {
        // 根据用户类型设置不同的显示样式
        // 优先级：管理员 > VIP > 普通用户 > 游客（管理员即使是VIP也优先显示管理员身份）
        let userBadge = '';
        let userClass = 'text-gray-600';
        
        if (item.user_role === 'admin') {
            // 👑管理员：红色徽章 + 红色加粗字体（最高优先级）
            userBadge = '<span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-600 font-bold">👑管理员</span>';
            userClass = 'text-red-600 font-bold';
        } else if (item.is_vip) {
            // 👑VIP会员：金色渐变徽章 + 橙色加粗字体
            userBadge = '<span class="px-2 py-1 text-xs rounded-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-bold">👑VIP</span>';
            userClass = 'text-orange-600 font-semibold';
        } else if (item.user_role === 'guest') {
            // 游客：灰色徽章 + 灰色字体
            userBadge = '<span class="px-2 py-1 text-xs rounded-full bg-gray-100 text-gray-500">游客</span>';
            userClass = 'text-gray-500';
        } else {
            // 普通用户：蓝色徽章 + 蓝色字体
            userBadge = '<span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-600">普通用户</span>';
            userClass = 'text-blue-600';
        }
        
        const statusBadge = item.status == 1 
            ? '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-600">正常</span>'
            : '<span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-600">屏蔽</span>';
        
        html += `
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-3">
                    <input type="checkbox" class="danmaku-checkbox rounded" value="${item.id}" onchange="updateSelection(${item.id}, this.checked)">
                </td>
                <td class="px-4 py-3 text-sm text-gray-600">#${item.id}</td>
                <td class="px-4 py-3 text-sm">
                    <div class="flex flex-col gap-1">
                        <span class="${userClass}">${item.username}</span>
                        ${userBadge}
                    </div>
                </td>
                <td class="px-4 py-3 text-sm text-gray-900 max-w-xs truncate" title="${item.video_name}">${item.video_name}</td>
                <td class="px-4 py-3 text-sm text-gray-900 max-w-xs truncate" title="${item.text}">${item.text}</td>
                <td class="px-4 py-3 text-sm">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded border" style="background-color: ${item.color}"></div>
                        <span class="text-xs text-gray-500">${item.color}</span>
                    </div>
                </td>
                <td class="px-4 py-3 text-sm text-gray-600">${item.time}s</td>
                <td class="px-4 py-3 text-sm text-gray-500 font-mono">${item.ip}</td>
                <td class="px-4 py-3 text-sm text-gray-500">${item.create_time}</td>
                <td class="px-4 py-3">${statusBadge}</td>
                <td class="px-4 py-3 text-sm">
                    <div class="flex gap-2">
                        <button onclick="toggleStatus(${item.id})" class="text-blue-600 hover:text-blue-800 font-medium">
                            ${item.status == 1 ? '屏蔽' : '恢复'}
                        </button>
                        <button onclick="deleteDanmaku(${item.id})" class="text-red-600 hover:text-red-800 font-medium">
                            删除
                        </button>
                    </div>
                </td>
            </tr>
        `;
    });
    
    $('#danmakuTableBody').html(html);
}

// 渲染分页
function renderPagination(current, last) {
    let html = '';
    
    if (current > 1) {
        html += `<button onclick="loadDanmakuList(${current - 1})" class="px-4 py-2 border rounded-lg hover:bg-gray-50">上一页</button>`;
    }
    
    for (let i = Math.max(1, current - 2); i <= Math.min(last, current + 2); i++) {
        const active = i === current ? 'bg-blue-600 text-white' : 'bg-white hover:bg-gray-50';
        html += `<button onclick="loadDanmakuList(${i})" class="px-4 py-2 border rounded-lg ${active}">${i}</button>`;
    }
    
    if (current < last) {
        html += `<button onclick="loadDanmakuList(${current + 1})" class="px-4 py-2 border rounded-lg hover:bg-gray-50">下一页</button>`;
    }
    
    $('#pagination').html(html);
}

// 切换全选
function toggleCheckAll() {
    const checked = $('#checkAll').prop('checked');
    $('.danmaku-checkbox').prop('checked', checked);
    
    if (checked) {
        $('.danmaku-checkbox').each(function() {
            selectedIds.add(parseInt($(this).val()));
        });
    } else {
        selectedIds.clear();
    }
}

// 更新选中状态
function updateSelection(id, checked) {
    if (checked) {
        selectedIds.add(id);
    } else {
        selectedIds.delete(id);
    }
}

// 切换弹幕状态
function toggleStatus(id) {
    if (!confirm('确定要切换此弹幕的显示状态吗？')) return;
    
    $.ajax({
        url: '/api/admin/danmaku/toggle',
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
        data: { id: id },
        success: function(res) {
            if (res.code === 200) {
                alert(res.msg);
                loadDanmakuList(currentPage);
                loadStats();
            } else {
                alert(res.msg || '操作失败');
            }
        }
    });
}

// 删除单条弹幕
function deleteDanmaku(id) {
    if (!confirm('确定要删除这条弹幕吗？此操作不可恢复！')) return;
    
    $.ajax({
        url: '/api/admin/danmaku/delete',
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
        data: { id: id },
        success: function(res) {
            if (res.code === 200) {
                alert('删除成功');
                loadDanmakuList(currentPage);
                loadStats();
            } else {
                alert(res.msg || '删除失败');
            }
        }
    });
}

// 批量删除
function batchDelete() {
    if (selectedIds.size === 0) {
        alert('请先选择要删除的弹幕');
        return;
    }
    
    if (!confirm(`确定要删除选中的 ${selectedIds.size} 条弹幕吗？此操作不可恢复！`)) return;
    
    $.ajax({
        url: '/api/admin/danmaku/batch-delete',
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
        data: { ids: Array.from(selectedIds) },
        success: function(res) {
            if (res.code === 200) {
                alert('批量删除成功');
                selectedIds.clear();
                $('#checkAll').prop('checked', false);
                loadDanmakuList(currentPage);
                loadStats();
            } else {
                alert(res.msg || '删除失败');
            }
        }
    });
}
</script>
{/block}
