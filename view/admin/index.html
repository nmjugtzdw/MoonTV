{extend name="admin/layout" /}

{block name="content"}
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <!-- 统计卡片 -->
    <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
        <div class="flex items-center">
            <div class="p-3 rounded-full bg-blue-100 text-blue-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            </div>
            <div class="ml-4">
                <p class="mb-2 text-gray-500 font-medium">总用户数</p>
                <p class="text-2xl font-bold text-gray-700" id="totalUsers">--</p>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6 border-l-4 border-green-500">
        <div class="flex items-center">
            <div class="p-3 rounded-full bg-green-100 text-green-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div class="ml-4">
                <p class="mb-2 text-gray-500 font-medium">今日签到</p>
                <p class="text-2xl font-bold text-gray-700" id="todayCheckins">--</p>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6 border-l-4 border-orange-500">
        <div class="flex items-center">
            <div class="p-3 rounded-full bg-orange-100 text-orange-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div class="ml-4">
                <p class="mb-2 text-gray-500 font-medium">今日新增</p>
                <p class="text-2xl font-bold text-gray-700" id="todayUsers">--</p>
            </div>
        </div>
    </div>
    
    <div class="bg-white rounded-lg shadow p-6 border-l-4 border-purple-500">
        <div class="flex items-center">
            <div class="p-3 rounded-full bg-purple-100 text-purple-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div class="ml-4">
                <p class="mb-2 text-gray-500 font-medium">付费用户</p>
                <p class="text-2xl font-bold text-gray-700" id="vipUsers">--</p>
            </div>
        </div>
    </div>
</div>

<!-- 最新注册用户 -->
<div class="bg-white rounded-lg shadow overflow-hidden">
    <div class="px-6 py-4 bg-gray-50 border-b flex justify-between items-center">
        <h3 class="text-lg font-medium text-gray-900">最新注册用户</h3>
        <a href="/admin/users" class="text-sm text-blue-600 hover:text-blue-800">查看全部 &rarr;</a>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr>
                    <th class="px-6 py-4 bg-gray-50 text-xs font-bold text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-4 bg-gray-50 text-xs font-bold text-gray-500 uppercase tracking-wider">用户名</th>
                    <th class="px-6 py-4 bg-gray-50 text-xs font-bold text-gray-500 uppercase tracking-wider">角色</th>
                    <th class="px-6 py-4 bg-gray-50 text-xs font-bold text-gray-500 uppercase tracking-wider">VIP状态</th>
                    <th class="px-6 py-4 bg-gray-50 text-xs font-bold text-gray-500 uppercase tracking-wider">注册时间</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="latestUsersBody">
                <!-- 动态填充 -->
                <tr><td colspan="5" class="px-6 py-4 text-center">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    $(document).ready(function() {
        loadDashboardData();
    });

    function loadDashboardData() {
        $.ajax({
            url: '/api/admin/dashboard',
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            success: function(res) {
                if (res.code === 200) {
                    const data = res.data;
                    $('#totalUsers').text(data.total_users);
                    $('#todayCheckins').text(data.today_checkins);
                    $('#todayUsers').text(data.today_users);
                    $('#vipUsers').text(data.vip_users);
                    
                    let html = '';
                    data.latest_users.forEach(u => {
                        html += `
                            <tr>
                                <td class="px-6 py-4 text-sm text-gray-500">#${u.id}</td>
                                <td class="px-6 py-4 text-sm font-medium text-gray-900">${u.username}</td>
                                <td class="px-6 py-4 text-sm text-gray-500">
                                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${u.role==='admin'?'bg-red-100 text-red-800':'bg-gray-100 text-gray-800'}">
                                        ${u.role}
                                    </span>
                                </td>
                                <td class="px-6 py-4 text-sm text-gray-500">
                                    ${u.is_vip ? '<span class="text-orange-500 font-bold">VIP</span>' : '普通'}
                                </td>
                                <td class="px-6 py-4 text-sm text-gray-500">${u.create_time || u.created_at}</td>
                            </tr>
                        `;
                    });
                    $('#latestUsersBody').html(html);
                }
            }
        });
    }
</script>
{/block}
