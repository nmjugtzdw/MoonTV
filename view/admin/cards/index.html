{extend name="admin/layout" /}

{block name="content"}
<div class="flex justify-between items-center mb-6">
    <h3 class="text-2xl font-bold text-gray-800">卡密管理</h3>
    <div class="flex gap-2">
        <button onclick="exportCards()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
            导出未使用
        </button>
        <button onclick="openModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            + 生成卡密
        </button>
    </div>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
    <!-- 筛选 -->
    <div class="p-4 border-b border-gray-200 flex gap-4">
        <select id="statusFilter" class="border rounded px-3 py-2 text-sm" onchange="loadCards(1)">
            <option value="">所有状态</option>
            <option value="unused">未使用</option>
            <option value="used">已使用</option>
        </select>
        <input type="text" id="searchInput" placeholder="搜索卡密" class="border rounded px-3 py-2 text-sm flex-1">
        <button onclick="loadCards(1)" class="bg-gray-100 px-4 py-2 rounded text-sm hover:bg-gray-200">搜索</button>
    </div>

    <table class="w-full text-left">
        <thead>
            <tr class="bg-gray-50 border-b">
                <th class="px-6 py-4 font-bold text-gray-600">ID</th>
                <th class="px-6 py-4 font-bold text-gray-600">卡密</th>
                <th class="px-6 py-4 font-bold text-gray-600">天数</th>
                <th class="px-6 py-4 font-bold text-gray-600">状态</th>
                <th class="px-6 py-4 font-bold text-gray-600">使用者</th>
                <th class="px-6 py-4 font-bold text-gray-600">使用时间</th>
                <th class="px-6 py-4 font-bold text-gray-600">操作</th>
            </tr>
        </thead>
        <tbody id="cardList" class="divide-y divide-gray-100">
            <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">加载中...</td></tr>
        </tbody>
    </table>
    
    <!-- 分页 -->
    <div class="mt-4 flex justify-between px-6 py-4" id="pagination"></div>
</div>

<!-- 生成卡密模态框 -->
<div id="cardModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-sm mx-4">
        <h3 class="text-xl font-bold mb-4">生成卡密</h3>
        
        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">生成数量 (张)</label>
                <input type="number" id="genCount" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="10" max="100">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">每张天数 (天)</label>
                <input type="number" id="genDays" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="30">
            </div>
        </div>
        
        <div class="flex gap-3 mt-6">
            <button onclick="closeModal()" class="flex-1 py-2 border rounded-lg text-gray-600 hover:bg-gray-50">取消</button>
            <button onclick="generateCards()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">确认生成</button>
        </div>
    </div>
</div>

<script>
    let currentPage = 1;

    $(document).ready(function() {
        loadCards(1);
    });

    function loadCards(page) {
        currentPage = page;
        const status = $('#statusFilter').val();
        const keyword = $('#searchInput').val();

        $.ajax({
            url: '/api/admin/cards',
            data: { page, status, keyword },
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            success: function(res) {
                if (res.code === 200) {
                    renderList(res.data.data);
                    renderPagination(res.data);
                }
            }
        });
    }

    function renderList(list) {
        let html = '';
        if (list.length === 0) {
            html = '<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">暂无数据</td></tr>';
        } else {
            list.forEach(item => {
                const statusClass = item.status === 'used' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800';
                const statusText = item.status === 'used' ? '已使用' : '未使用';
                
                html += `
                    <tr>
                        <td class="px-6 py-4 text-gray-500">#${item.id}</td>
                        <td class="px-6 py-4 font-mono text-gray-900 select-all">${item.code}</td>
                        <td class="px-6 py-4 text-gray-600">${item.value} 天</td>
                        <td class="px-6 py-4">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">
                                ${statusText}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-gray-500">${item.used_by || '-'}</td>
                        <td class="px-6 py-4 text-gray-500 text-xs">${item.used_at || '-'}</td>
                        <td class="px-6 py-4">
                            <button onclick="deleteCard(${item.id})" class="text-red-600 hover:text-red-800">删除</button>
                        </td>
                    </tr>
                `;
            });
        }
        $('#cardList').html(html);
    }

    function renderPagination(data) {
        // Simple pagination
        let html = `
            <button onclick="loadCards(${data.current_page - 1})" ${data.current_page === 1 ? 'disabled' : ''} class="px-4 py-2 border rounded ${data.current_page===1?'text-gray-400':'hover:bg-gray-50'}">上一页</button>
            <span>第 ${data.current_page} 页</span>
            <button onclick="loadCards(${data.current_page + 1})" ${data.current_page === data.last_page ? 'disabled' : ''} class="px-4 py-2 border rounded ${data.current_page===data.last_page?'text-gray-400':'hover:bg-gray-50'}">下一页</button>
        `;
        $('#pagination').html(html);
    }

    function openModal() {
        $('#cardModal').removeClass('hidden').addClass('flex');
    }

    function closeModal() {
        $('#cardModal').addClass('hidden').removeClass('flex');
    }

    function generateCards() {
        const count = $('#genCount').val();
        const days = $('#genDays').val();
        
        const btn = $('button[onclick="generateCards()"]');
        btn.prop('disabled', true).text('生成中...');

        $.ajax({
            url: '/api/admin/cards/generate',
            method: 'POST',
            contentType: 'application/json',
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            data: JSON.stringify({ count, days }),
            success: function(res) {
                if (res.code === 200) {
                    alert('生成成功');
                    closeModal();
                    loadCards(1);
                } else {
                    alert(res.msg || '生成失败');
                }
            },
            complete: function() {
                btn.prop('disabled', false).text('确认生成');
            }
        });
    }

    function deleteCard(id) {
        if (!confirm('删除后不可恢复，确定吗？')) return;
        $.ajax({
            url: '/api/admin/cards/delete',
            method: 'POST',
            contentType: 'application/json',
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('admin_token')},
            data: JSON.stringify({ id }),
            success: function(res) {
                if (res.code === 200) loadCards(currentPage);
            }
        });
    }
    
    function exportCards() {
        window.open('/api/admin/cards/export', '_blank');
    }
</script>
{/block}
